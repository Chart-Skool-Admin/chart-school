 cards:[{q:"Resistance at 60k breaks clearly. Price later falls back to 60k. What often happens?",o:["60k acts as support","Price falls straight through","It goes to zero"],a:0,e:"Old resistance often becomes new support.",ex:"flip"}],chart:["sr"]},

{id:"l8",n:8,t:"Risk first",min:10,steps:[
 S("hook",{text:"The best traders aren't the ones who win most. They're the ones who lose small."}),
 S("guess",{q:"You win 4 trades out of 10. Each win makes 2× what you risked (2R), each loss costs what you risked (1R). Do you make money?",o:["Yes, about +0.2R per trade","No, you lose more often than you win","Break even"],a:0,e:"Over 10 trades: 4 wins × 2R = +8R, 6 losses × 1R = −6R. Net +2R, or +0.2R per trade. Win rate alone means nothing."}),
 S("tool",{kind:"sim"}),
 S("guess",{q:"Now you win 6 trades out of 10, but each win only makes half of what you risked (0.5R). Each loss still costs 1R. Do you make money?",o:["No, about −0.1R per trade","Yes, you win most trades","Break even"],a:0,e:"Over 10 trades: 6 wins × 0.5R = +3R, 4 losses × 1R = −4R. Net −1R, or −0.1R per trade. A high win rate can still lose."}),
 S("tool",{kind:"size"}),
 S("guess",{q:"You have $10,000 and will risk 1% of it, so $100. You buy BTC at $60,000 with a stop at $57,600. If the stop is hit, you lose $2,400 for every whole BTC. How much BTC can you buy so the most you lose is $100?",o:["About 0.042 BTC","0.167 BTC","1 BTC"],a:0,e:"Step 1: your risk is 1% of $10,000 = $100. Step 2: loss per BTC = $60,000 − $57,600 = $2,400. Step 3: $100 ÷ $2,400 = 0.042 BTC (about $2,500 worth). If the stop is hit you lose 0.042 × $2,400 = $100. Size comes from the stop.",ex:"stop"}),
 S("guess",{q:"Your $10,000 account falls 50% to $5,000. What % gain do you need to get back to $10,000?",o:["100%","50%","25%"],a:0,svg:"drawdown",e:"$5,000 has to double to get back to $10,000, so +100%. Losses hurt more than gains help. Protect capital first."}),
 S("explain",{q:"Why size from the stop and not from how sure you feel?",model:"Confidence doesn't change the odds. Sizing from the stop keeps every loss the same small amount."})],
 cards:[{q:"While learning, the most you should risk on one trade is…",o:["1% of the account","5%","Whatever feels right"],a:0,e:"0.5 to 1% keeps a normal losing streak survivable."},
  {q:"Ten coins bought equally in January 2018 lost about 61% by July. The lesson?",o:["Crypto coins crash together; stops and sizing protect you","Buy more coins next time","Only buy Bitcoin"],a:0,e:"Spreading money across coins isn't real protection in a crypto crash."}]}
];
/* ---------- Level 2 lessons: core chart reading ---------- */
LESSONS.forEach(L=>L.lv=L.lv||1);
LESSONS.push(
{id:"l9",n:9,lv:2,t:"Trendlines and channels",min:10,steps:[
 S("hook",{text:"One straight line can show you the trend, where to get in, and the moment the trend starts to crack."}),
 S("guess",{q:"To draw an uptrend line, you connect…",o:["Two or more rising swing lows","The two highest highs","Any two candles that look important"],a:0,e:"Uptrend line: under the rising lows. Downtrend line: along the falling highs. Two points draw it; a third touch confirms it.",ex:"tline:up"}),
 S("learn",{title:"Drawing it right",svg:"tline",text:"Connect swing lows in an uptrend, swing highs in a downtrend. Go through the most points, and let a few wicks poke through rather than slicing through candle bodies."}),
 S("drill",{kind:"tline",n:2}),
 S("guess",{pic:"tl2",q:"Which trendline matters more?",o:["One touched 4 times over months","One touched twice last week","The steepest one on the chart"],a:0,e:"More touches, a longer life and a gentler angle all make a line more important. Very steep lines break quickly."}),
 S("guess",{q:"Price closes clearly below a long uptrend line. What does it mean?",o:["A warning that the trend may change; now check the swings","Sell short right away","Nothing, lines don't matter"],a:0,e:"A trendline break is an early warning. Proof still comes from the swing structure: a lower high and a lower low.",ex:"tbreak"}),
 S("learn",{title:"Channels",svg:"channel",text:"Draw a line parallel to the trendline across the peaks. Price often swings between the two. When a rally can't reach the top line, buyers are weakening."}),
 S("guess",{q:"In an up channel, a rally stops well short of the top line. That suggests…",o:["Buyers are weakening; watch the lower line","The trend is speeding up","Nothing at all"],a:0,e:"Failing to reach the channel top often comes before the lower line breaks.",ex:"channel"}),
 S("drill",{kind:"tline",n:1}),
 S("explain",{q:"Why does a broken uptrend line often act as resistance later?",model:"Same as broken support: people who bought near the line are now losing and sell when price comes back up to it, so the line flips roles.",ex:"tbreak"})],
 cards:[{q:"A trendline is drawn on…",o:["Swing lows in an uptrend, swing highs in a downtrend","Closing prices anywhere","The single most extreme wick"],a:0,e:"Use the swing points. The line should touch the turns, not one odd spike."},
  {pic:"steeper",q:"Very steep trendlines usually…",o:["Break soon and get redrawn at a gentler angle","Are the most reliable","Never break"],a:0,e:"A steep pace can't last. When it breaks, the trend often carries on at a slower angle (the fan principle)."}],chart:["tline"]},

{id:"l10",n:10,lv:2,t:"Retracements and pullbacks",min:9,steps:[
 S("hook",{text:"Trends never move in a straight line. The pullback is where traders get in, if they can tell it from a reversal."}),
 S("guess",{q:"A normal pullback in a trend usually gives back…",o:["⅓ to ⅔ of the last swing, often half","Exactly 10%","All of it"],a:0,e:"The 33 to 66% zone. Fibonacci traders use 38% and 62%, which sit inside the same zone.",ex:"retrace"}),
 S("learn",{title:"The pullback zone",svg:"retr",text:"Measure the last swing from start to end. Shallow pullbacks (under ⅓) show a strong trend. Deep ones (over ⅔) put the trend in doubt."}),
 S("drill",{kind:"retr",n:3}),
 S("guess",{q:"Why do Fibonacci levels like 38.2% and 61.8% seem to work?",o:["Many traders watch them, and they sit in the normal pullback zone anyway","Nature makes markets obey them","They're exact to the cent"],a:0,e:"Treat them as a zone, not magic. Most of their \"hits\" land in the ⅓ to ⅔ area that pullbacks visit anyway."}),
 S("guess",{q:"Healthy pullbacks often come in how many legs?",o:["Two: down, a small bounce, down again","One straight drop","Five"],a:0,e:"The two-legged pullback is the classic shape. The second leg shakes out the last nervous buyers before the trend resumes.",ex:"twoleg"}),
 S("guess",{pic:"pullAB",q:"Pullback A drifts down on small candles. Pullback B is a sudden drop of big red candles. Which worries an uptrend more?",o:["B","A"],a:0,e:"Fast, strong counter-moves show real selling. Quiet, overlapping pullbacks are usually just profit-taking."}),
 S("explain",{q:"How do you tell a healthy pullback from the start of a reversal?",model:"A healthy pullback is shallow to normal (under ⅔), quiet, and holds above the last swing low. A reversal goes deeper, moves fast and breaks the swing low."})],
 cards:[{pic:"deep",q:"Price gives back 90% of the last rise. Most likely…",o:["The uptrend is in doubt","It's a normal buying chance","The trend is very strong"],a:0,e:"Over ⅔ back is a deep pullback. Watch whether the last swing low breaks."},
  {q:"The 50% pullback level comes from…",o:["Old Dow Theory observation, not Fibonacci","The Fibonacci sequence","Elliott Wave only"],a:0,e:"50% isn't a Fibonacci ratio. It's simply the most common pullback size traders have seen for over a century."}],chart:["retr"]},

{id:"l11",n:11,lv:2,t:"Trading ranges",min:9,steps:[
 S("hook",{text:"Markets spend a big part of their time going nowhere. Ranges have their own rules, and most breakouts from them fail."}),
 S("guess",{q:"Inside a range, the better trade is usually…",o:["Buy near support, sell near resistance","Buy every breakout above resistance","Buy in the middle"],a:0,e:"In a range, trading back from the edges works more often than chasing breakouts.",ex:"range"}),
 S("drill",{kind:"sr",n:1}),
 S("learn",{title:"Breakout or fake-out?",svg:"fake",text:"A real breakout closes outside the range and keeps going. A fake-out pokes out, then closes back inside and traps the breakout buyers."}),
 S("drill",{kind:"brk",n:3}),
 S("guess",{q:"Price breaks above a range, then quickly closes back inside. Where does it often go next?",o:["Toward the other side of the range","Straight back up","Nowhere, it freezes"],a:0,e:"Trapped breakout buyers sell to get out, which pushes price back across the range. A failed breakout is a trade signal of its own.",ex:"fake"}),
 S("guess",{pic:"range",q:"Which is a good sign before a range breakout?",o:["Price presses the edge with higher lows and tighter swings","A sudden spike out of nowhere","A very wide, messy range"],a:0,e:"Pressure building at one edge, like rising lows into resistance, shows one side winning. Breakouts from tight, coiled ranges work better."}),
 S("explain",{q:"Why do so many range breakouts fail?",model:"A range means buyers and sellers are in balance. Lots of traders sell at the top, so price needs real new demand to break out. Without it, it falls back in."})],
 cards:[{q:"After a clean breakout, price often comes back to…",o:["Retest the old range edge from the other side","The range bottom","Where the range started"],a:0,e:"Old ceiling becomes the new floor: role reversal again.",ex:"flip"},
  {pic:"range",q:"The classic target for a range breakout is…",o:["The range's height added to the breakout point","Twice the range","The last swing high"],a:0,e:"Project the range height from the breakout level. A rough guide, not a promise."}],chart:["brk"]},

{id:"l12",n:12,lv:2,t:"Single and two-candle reversals",min:10,steps:[
 S("hook",{text:"Japanese rice traders read candles 300 years ago. A few shapes still show the moment one side gives up."}),
 S("guess",{q:"Small body at the top, long lower shadow, after a fall. This is a…",o:["Hammer","Hanging man","Shooting star"],a:0,e:"Hammer: sellers pushed price down hard and buyers drove it back up. The lower shadow is at least twice the body.",ex:"cdl:hammer"}),
 S("guess",{q:"The same shape, but after a rally. Now it's called…",o:["Hanging man","Hammer","Doji"],a:0,e:"Same candle, different meaning. After a rise it's a hanging man, and it needs a lower close next to confirm.",ex:"cdl:hangman"}),
 S("learn",{title:"Reversal candles",svg:"c12",text:"Long lower shadow: hammer (after a fall) or hanging man (after a rise). Long upper shadow: shooting star (after a rise) or inverted hammer (after a fall). Engulfing: a body that swallows the one before."}),
 S("drill",{kind:"cdl12",n:3}),
 S("guess",{q:"A big green candle, then a red one opens above its high and closes below its middle. This is…",o:["Dark cloud cover","Bullish engulfing","Piercing pattern"],a:0,e:"Dark cloud cover: the rally gets swamped. The deeper the close into the green body, the stronger it is.",ex:"cdl:dark"}),
 S("guess",{q:"What matters most for any reversal candle?",o:["Where it shows up: after a clear move, at a key level","Its colour","The time of day"],a:0,e:"A reversal candle needs a trend to reverse. In the middle of a range it means little."}),
 S("drill",{kind:"cdl12",n:1}),
 S("explain",{q:"Why is a hanging man weaker than a hammer, and what do you wait for?",model:"Buyers did push back up during the candle, so it needs proof. I wait for the next candle to close below the hanging man's body.",ex:"cdl:hangman"})],
 cards:[{q:"Bullish engulfing needs…",o:["A fall, then a green body that covers the previous red body","Any two green candles","A rally first"],a:0,e:"The second body must cover the first body completely. Shadows don't count.",ex:"cdl:bengulf"},
  {q:"A shooting star is…",o:["A small body at the bottom with a long upper shadow, after a rise","A long lower shadow after a fall","A big green candle"],a:0,e:"Price spiked up and got slapped back down. Sellers showed up.",ex:"cdl:star"}],chart:["cdl12"]},

{id:"l13",n:13,lv:2,t:"Stars, harami, doji and continuation candles",min:10,steps:[
 S("hook",{text:"Some patterns show a trend stalling before it turns. Others show a trend just catching its breath."}),
 S("guess",{q:"Big red candle, a small candle gapping lower, then a big green candle closing well into the red body. This is…",o:["Morning star","Evening star","Harami"],a:0,e:"Morning star: sellers, then indecision, then buyers take over. A bottom.",ex:"cdl:mstar"}),
 S("learn",{title:"Stars, harami and doji",svg:"c13",text:"Star: a small body set apart between two big ones. Harami: a small body inside the previous big body. Doji: open equals close; after a long trend it's a warning."}),
 S("drill",{kind:"cdl13",n:3}),
 S("guess",{q:"A harami means…",o:["The trend has lost momentum, but it hasn't reversed yet","A strong reversal is confirmed","The trend is speeding up"],a:0,e:"Harami means \"pregnant\" in old Japanese. The small inside body shows the move running out of steam. It's weaker than engulfing.",ex:"cdl:bharami"}),
 S("guess",{q:"Why does a doji after a long rally matter more than a doji in a range?",o:["Buyers who were in control are now only matching sellers","Dojis only appear at tops","Ranges don't have dojis"],a:0,e:"Indecision matters when one side had been winning. In a range, indecision is normal.",ex:"cdl:doji"}),
 S("guess",{q:"A big green candle, three small red ones inside it, then another big green. What does this signal?",o:["The uptrend continues; the pause was just a rest","A top is forming","Nothing"],a:0,e:"Rising three methods. Sellers couldn't even break the first candle's low, so buyers carry on.",ex:"cdl:r3"}),
 S("drill",{kind:"cdl13",n:1}),
 S("explain",{q:"What does the small middle candle of a star tell you?",model:"Neither side is in control any more. The trend has stalled, and the third candle shows who takes over."})],
 cards:[{pic:"gap",q:"A gap between two candles is called a…",o:["Window","Star","Shadow"],a:0,e:"Japanese traders call gaps windows. A rising window tends to act as support later, a falling window as resistance."},
  {q:"An evening star shows up…",o:["After a rally, and signals a top","After a fall, and signals a bottom","In the middle of a range"],a:0,e:"Big green, small star above, big red closing deep into the green body.",ex:"cdl:estar"}],chart:["cdl13"]},

{id:"l14",n:14,lv:2,t:"Candles plus Western tools",min:9,steps:[
 S("hook",{text:"A candle signal on its own is weak. The same signal at the right place is one of the best tools you'll have."}),
 S("guess",{pic:"ctxvs",q:"A hammer forms right at a support zone that held twice before. Compared with a hammer in mid-air, it's…",o:["Much more meaningful","Exactly the same","Less meaningful"],a:0,e:"Two clues agreeing, a level and a candle, is called confluence. That's where the edge lives.",ex:"ctx"}),
 S("learn",{title:"Confluence",svg:"conf",text:"Look for candle signals at support or resistance, at a trendline, or at the end of a normal pullback. Ignore signals in the middle of nowhere."}),
 S("drill",{kind:"ctx",n:3}),
 S("guess",{pic:"engres",q:"A bullish engulfing forms just under strong resistance. Good buy?",o:["Risky: there's little room before the ceiling","A great buy","Only if it's green"],a:0,e:"Always check the room to the next level. Buying right under resistance gives a small reward for the risk."}),
 S("guess",{q:"Where does the stop go after a hammer at support?",o:["Just below the hammer's low","At the hammer's close","No stop is needed"],a:0,e:"If price trades below the hammer's low, the buyers who made it have failed. That's the proof you're wrong.",ex:"ctx"}),
 S("drill",{kind:"ctx",n:1}),
 S("explain",{q:"Name three things that make a candle signal worth acting on.",model:"It comes after a clear move, it's at a key level like support, resistance or a trendline, and the next candle confirms it."})],
 cards:[{q:"Candle signals tell you…",o:["Short-term shifts in control, not how far price will go","Exact price targets","The long-term trend"],a:0,e:"Candles are good for timing. For targets, use levels and patterns."},
  {pic:"ex:cdl:star",q:"A shooting star touches the top line of a down channel. That's…",o:["Confluence: a stronger sell signal","A buy signal","Meaningless"],a:0,e:"The candle and the line agree: sellers are defending that line."}],chart:["ctx"]},

{id:"l15",n:15,lv:2,t:"Classical reversal patterns",min:10,steps:[
 S("hook",{text:"Some chart shapes have been studied for a century. They mark the place where a trend runs out of buyers or sellers."}),
 S("guess",{q:"Three peaks, the middle one highest, with a line under the two dips. This is…",o:["Head and shoulders","Triple top","Ascending triangle"],a:0,e:"A head and shoulders top. The line under the dips is the neckline.",ex:"pat:hs"}),
 S("learn",{title:"Head and shoulders",svg:"hs",text:"Left shoulder, higher head, lower right shoulder. It only completes when price closes below the neckline. Target: the head-to-neckline height, projected down from the break."}),
 S("drill",{kind:"pat15",n:2}),
 S("guess",{q:"When is a double top confirmed?",o:["When price closes below the low between the two peaks","When the second peak forms","When volume rises"],a:0,e:"Until that middle low breaks, it's just a range. Many \"double tops\" turn into higher highs.",ex:"pat:dt"}),
 S("guess",{pic:"hsn:130:110",q:"Head at 130, neckline at 110, the neckline breaks. Minimum target?",o:["90","100","70"],a:0,e:"Height = 130 − 110 = 20. Project it down from the break: 110 − 20 = 90. A guide, not a promise.",svg:"hs"}),
 S("guess",{q:"After the neckline breaks, price often…",o:["Comes back up to test the neckline, which now acts as resistance","Goes straight down without a pause","Makes a new head"],a:0,e:"The return move to the neckline is common. It gives a second chance to sell, with a tight stop.",ex:"pat:hs"}),
 S("drill",{kind:"pat15",n:1}),
 S("explain",{q:"Why wait for the neckline break instead of selling the right shoulder?",model:"Until the neckline breaks, the trend's lows still hold, and many patterns never complete. The break is the proof."})],
 cards:[{q:"An inverse head and shoulders is…",o:["A bottom, the mirror image of the top pattern","A top pattern","A continuation pattern"],a:0,e:"Three troughs, the middle one lowest. It completes on a close above the neckline.",ex:"pat:hsi"},
  {pic:"ex:pat:hs",q:"In a head and shoulders top, volume is often…",o:["Lighter on the head and right shoulder than on the left","Highest on the right shoulder","Unimportant"],a:0,e:"Fading volume on each new high shows buyers getting tired."}],chart:["pat15"]},

{id:"l16",n:16,lv:2,t:"Continuation patterns",min:10,steps:[
 S("hook",{text:"Most patterns aren't reversals. They're the trend catching its breath before the next leg."}),
 S("guess",{q:"Flat top, rising lows. This is…",o:["Ascending triangle","Descending triangle","Head and shoulders"],a:0,e:"Buyers keep paying more each time while sellers defend one price. It usually breaks up.",ex:"pat:asc"}),
 S("learn",{title:"Triangles and flags",svg:"cont",text:"Triangles: the swings get smaller as price coils. Flags: a short, sloping box right after a sharp move (the pole). Both usually break in the trend's direction."}),
 S("drill",{kind:"pat16",n:3}),
 S("guess",{q:"A flag's measured target is…",o:["The pole's height added to the breakout","The flag's own height","The last swing low"],a:0,e:"\"Flags fly at half-mast\": the move after a flag is often about as big as the move before it.",ex:"pat:bflag"}),
 S("guess",{q:"A symmetrical triangle usually breaks…",o:["In the direction of the trend before it","Always up","Always down"],a:0,e:"It's a neutral shape, so the existing trend usually wins. Wait for the break.",ex:"pat:sym"}),
 S("guess",{pic:"tri",q:"Price drifts all the way to the tip of a triangle without breaking. That means…",o:["The pattern is losing its power","A huge move is guaranteed","Buy now"],a:0,e:"Breakouts work best about half to three quarters of the way into a triangle. At the tip it often just fizzles."}),
 S("drill",{kind:"pat16",n:1}),
 S("explain",{q:"What's the difference between a flag and a range?",model:"A flag is short, comes right after a sharp move and slopes against it. A range can last a long time and has no pole before it."})],
 cards:[{q:"A descending triangle (flat bottom, falling highs) usually breaks…",o:["Down","Up","Sideways"],a:0,e:"Sellers keep pressing lower each time while buyers defend one price.",ex:"pat:desc"},
  {pic:"ex:pat:bflag",q:"Flags usually last…",o:["A short time: a few candles to a few weeks","Many months","Exactly 10 candles"],a:0,e:"If a \"flag\" drags on, treat it as something else."}],chart:["pat16"]},

{id:"l17",n:17,lv:2,t:"Volume and open interest",min:10,steps:[
 S("hook",{text:"Price tells you what happened. Volume tells you how much conviction was behind it."}),
 S("guess",{q:"Price breaks out of a range on twice the normal volume. This…",o:["Makes the breakout more believable","Means it will fail","Doesn't matter"],a:0,e:"Heavy volume on the break shows real new buying. Thin-volume breakouts fail more often.",ex:"volbrk"}),
 S("learn",{title:"Volume confirms",svg:"vol",text:"In a healthy trend, volume grows in the trend's direction and shrinks on pullbacks. Price pushing on while volume fades is a warning."}),
 S("drill",{kind:"vol",n:3}),
 S("guess",{pic:"lowvol",q:"BTC makes a new high, but volume is the lowest of the whole rally. That's…",o:["A warning: fewer buyers are pushing it","Very bullish","Normal and fine"],a:0,e:"Fading volume into a new high shows tiring buyers. It's not a sell signal alone, but a reason to be careful."}),
 S("guess",{q:"Open interest is…",o:["The number of futures contracts still open","The day's trading volume","The contract's price"],a:0,e:"Each open contract has a buyer and a seller. Rising open interest means new money coming in; falling means positions closing."}),
 S("guess",{pic:"oi:up:down",q:"Price rising while open interest falls usually means…",o:["Shorts are closing (short covering), not fresh buying","Strong new buying","Nothing"],a:0,e:"Price up with open interest up = new longs, healthy. Price up with open interest down = shorts buying back, which often runs out of fuel."}),
 S("guess",{q:"A huge volume spike after a long fall, with a long lower wick, often marks…",o:["A selling climax: the panic low","The start of a crash","Nothing special"],a:0,e:"Climax volume shows the last sellers giving up, like the panic low from Lesson 1.",ex:"panic"}),
 S("drill",{kind:"vol",n:1}),
 S("explain",{q:"Why should volume grow in the direction of the trend?",model:"Rising volume with the trend shows more traders joining it. If volume fades as price pushes on, fewer people believe in the move."})],
 cards:[{pic:"oi:up:up",q:"In crypto, a very high funding rate plus rising open interest means…",o:["Lots of leveraged longs: crowded and at risk of a flush","A safe, healthy rally","Shorts are in control"],a:0,e:"Crowded leverage can unwind fast. Long squeezes and liquidation cascades start this way."},
  {q:"Crypto volume numbers are best used…",o:["To compare rising and falling volume on one big exchange, not as exact truth","As exact totals for the whole market","Not at all"],a:0,e:"Volume is spread over many exchanges and some of it is inflated. Look at the pattern, not the exact number."}],chart:["vol"]}
);

/* ---------- Level 3 lessons: indicators and structure ---------- */
LESSONS.push(
{id:"l18",n:18,lv:3,t:"Moving averages",min:10,steps:[
 S("hook",{text:"A moving average turns a messy chart into one smooth line. It can't predict anything, but it shows the trend at a glance."}),
 S("guess",{pic:"closes",q:"The last 5 closes are 10, 11, 12, 13 and 14. What is the 5-period simple moving average?",o:["12","14","10"],a:0,e:"Add them up (60) and divide by 5 = 12. Next candle, the oldest close drops out and the newest comes in, so the average \"moves\"."}),
 S("learn",{title:"Smoothing, with a delay",svg:"ma",text:"A simple MA (SMA) averages the last N closes equally. An exponential MA (EMA) gives the newest closes more weight, so it turns sooner. Both lag: they confirm a move after it has started."}),
 S("guess",{pic:"maturn",q:"Which line turns first when price changes direction?",o:["A 20-period EMA","A 20-period SMA","A 200-period SMA"],a:0,e:"The EMA weights the newest closes most, so it reacts first. The longer the average, the slower it turns."}),
 S("tool",{kind:"ma"}),
 S("guess",{q:"Price is above a rising 50-day MA and keeps dipping to it and bouncing. What is the MA doing?",o:["Acting as moving support in an uptrend","Giving a sell signal at each touch","Nothing: MAs are only for crossovers"],a:0,e:"In a healthy trend, traders buy pullbacks to a well-watched average. A clear close below it is the first warning.",ex:"ma"}),
 S("drill",{kind:"ma",n:2}),
 S("guess",{q:"The 50-day MA crosses above the 200-day MA. Traders call this…",o:["A golden cross: a slow, late sign the trend has turned up","A death cross","A guaranteed rally"],a:0,e:"Golden cross (50 above 200) and death cross (50 below 200) are famous but late. By the time they happen, a good part of the move is often done.",ex:"gcross"}),
 S("guess",{pic:"chop",q:"In a sideways market, moving average crossovers usually…",o:["Whipsaw: buy high, sell low, again and again","Work best","Never happen"],a:0,e:"Flat, tangled averages cross back and forth, and each cross is a false signal. MAs are trend tools; ranges beat them."}),
 S("drill",{kind:"ma",n:1}),
 S("explain",{q:"Why does a moving average always lag, and when does that hurt?",model:"It's an average of past prices, so it can only turn after price has. That's fine in a long trend, but at a sharp turn it's late, and in a range it whipsaws.",ex:"ma"})],
 cards:[{q:"The most watched moving average lengths are…",o:["20 (short), 50 (medium) and 200 (long-term trend)","5, 10 and 15","Only the 9"],a:0,e:"Because so many traders watch the 20, 50 and 200, price often reacts near them."},
  {q:"The most useful thing a moving average tells you is…",o:["Its slope, and which side of it price is on","The exact price to buy","How many trades happened"],a:0,e:"Rising MA with price above: uptrend. Falling MA with price below: downtrend. Flat MA: no trend."}],chart:["ma"]},

{id:"l19",n:19,lv:3,t:"RSI and stochastics",min:10,steps:[
 S("hook",{text:"Oscillators measure speed, not direction. A car can still be moving forward while it slows down, and that slowdown is the warning they give."}),
 S("guess",{q:"RSI runs from 0 to 100. The classic readings are…",o:["Over 70 overbought, under 30 oversold","Over 50 sell, under 50 buy","Over 100 means a crash"],a:0,e:"RSI (usually 14 periods) compares the size of recent up closes with recent down closes. Above 70, price rose fast. Below 30, it fell fast."}),
 S("guess",{q:"BTC is in a strong uptrend and RSI has been over 70 for two weeks. Should you short it?",o:["No: in a strong trend RSI can stay overbought for a long time","Yes: it's overbought","Yes, with double size"],a:0,e:"Overbought is not a sell signal on its own. In strong uptrends RSI often lives between 40 and 80. Use it with the trend: buy dips when RSI cools to about 40 to 50.",ex:"rsiob"}),
 S("learn",{title:"Divergence",svg:"div",text:"Price makes a higher high, but RSI makes a lower high: the second push had less force. That's bearish divergence. The mirror image at a low is bullish divergence. It's a warning; the swings still have to break."}),
 S("drill",{kind:"rsi",n:2}),
 S("guess",{q:"Price makes a lower low, but RSI makes a higher low. This is…",o:["Bullish divergence: selling is losing force","Bearish divergence","A confirmed new downtrend"],a:0,e:"The new low came with less downside force. Wait for price to confirm, for example a break above the last lower high.",ex:"rsidiv"}),
 S("learn",{title:"Stochastics",svg:"stoch",text:"Stochastics shows where the close sits inside the recent high-low range: 100 means at the very top, 0 at the bottom. Over 80 is overbought, under 20 oversold. The signal is the fast line (%K) crossing the slow line (%D) in those zones."}),
 S("guess",{q:"Where do oscillators like RSI and stochastics work best?",o:["In ranges, near the edges","In strong trends, against the trend","Everywhere equally"],a:0,e:"In a range, overbought and oversold readings near the edges line up with real turns. In a strong trend they give early, losing signals against it."}),
 S("drill",{kind:"rsi",n:1}),
 S("explain",{q:"Why is an overbought RSI not enough reason to sell?",model:"It only says price rose fast, and strong trends stay overbought. I'd want a divergence plus a break in the swing structure, ideally at resistance.",ex:"rsiob"})],
 cards:[{q:"A stochastic reading of 95 means…",o:["The close is near the top of the recent high-low range","95% of traders are buying","Price will fall 95%"],a:0,e:"Stochastics measures where the close sits in the last 14 candles' high-low range."},
  {pic:"div",q:"A divergence is best treated as…",o:["A warning that needs price to confirm","A signal to trade right away","Proof the trend is over"],a:0,e:"Divergences can repeat several times before a turn. Wait for the swing structure to break."}],chart:["rsi"]},

{id:"l20",n:20,lv:3,t:"MACD and momentum",min:10,steps:[
 S("hook",{text:"MACD turns two moving averages into one picture of momentum. It often shows a move slowing before the price turns."}),
 S("guess",{q:"The MACD line is…",o:["The 12 EMA minus the 26 EMA","An average of RSI","Volume times price"],a:0,e:"When the fast EMA pulls away from the slow one, momentum is building. The signal line is a 9-period EMA of the MACD line."}),
 S("learn",{title:"Three parts",svg:"macd",text:"MACD line (12 EMA − 26 EMA), signal line (9 EMA of the MACD line), histogram (MACD minus signal). Above zero: the fast average is above the slow one, an up bias. A shrinking histogram: momentum is fading."}),
 S("guess",{q:"The 12 EMA is 105, the 26 EMA is 100, and the signal line is 6. What is the histogram?",o:["−1: MACD (5) is under its signal, momentum is slowing","+5: strong momentum","+11"],a:0,e:"MACD = 105 − 100 = 5. Histogram = 5 − 6 = −1. A negative histogram means the MACD line has dipped under its signal line."}),
 S("drill",{kind:"macd",n:2}),
 S("guess",{q:"Price keeps making new highs, but each histogram bar is smaller. That suggests…",o:["The rally is losing momentum: watch for a pause or a turn","The rally is speeding up","A short you must take now"],a:0,e:"The histogram usually shrinks before price turns. It's an early warning, not a reason to short on its own.",ex:"macd"}),
 S("guess",{q:"10-period momentum compares…",o:["Today's close with the close 10 candles ago","Today's high with today's low","Two different coins"],a:0,e:"Momentum = close now − close 10 candles ago. Above zero and rising: the move is speeding up. It tends to peak before price does."}),
 S("guess",{pic:"downosc",q:"In a long downtrend, the MACD line crosses above its signal line far below zero. Best read?",o:["Downside momentum is easing, but the trend is still down","A strong new uptrend has started","Nothing at all"],a:0,e:"Crosses in the trend's direction are more reliable. A cross against a big trend is often just a bounce."}),
 S("drill",{kind:"macd",n:1}),
 S("explain",{q:"Why can the MACD histogram warn you before the MACD lines cross?",model:"The histogram is the gap between MACD and its signal line. It starts shrinking as soon as momentum slows, before the lines actually cross.",ex:"macd"})],
 cards:[{q:"MACD above zero means…",o:["The 12 EMA is above the 26 EMA: an up bias","Price is above zero","RSI is over 50"],a:0,e:"The zero line is where the two averages cross. Above it, the faster average is on top."},
  {q:"The standard MACD settings are…",o:["12, 26, 9","14, 3, 3","20, 2"],a:0,e:"12 and 26 EMAs, 9 for the signal. 14,3,3 is stochastics and 20,2 is Bollinger Bands."}],chart:["macd"]},

{id:"l21",n:21,lv:3,t:"The market cycle and the four trades",min:10,steps:[
 S("hook",{text:"Every trade you'll ever take is one of just four kinds. Knowing which one you're in tells you where your stop belongs."}),
 S("guess",{q:"Remember the market cycle. After markup comes…",o:["Distribution: early buyers sell to late ones","Accumulation","Another markup, always"],a:0,e:"Accumulation (flat after a fall), markup (uptrend), distribution (flat after a rise), markdown (downtrend). Then it starts again.",svg:"cycle"}),
 S("drill",{kind:"phase",n:1}),
 S("learn",{title:"The four trades",svg:"four",text:"1. Trend continuation: join a trend on a pullback. 2. Trend termination: bet a trend is ending. 3. Support or resistance holds: trade back from a range edge. 4. Support or resistance breaks: trade the breakout."}),
 S("guess",{pic:"pullema",q:"BTC is in a clear uptrend and pulls back to a rising 20 EMA near old support. Buying there is which trade?",o:["Trend continuation","Trend termination","Breakout"],a:0,e:"You're betting the trend carries on after a pause. If the pullback's low breaks, the idea is wrong."}),
 S("drill",{kind:"trade4",n:2}),
 S("guess",{q:"Which of the four trades usually wins least often?",o:["Trend termination: trends tend to keep going","Trend continuation","They all win equally often"],a:0,e:"Picking tops and bottoms fights the trend. It can pay well, but needs strong evidence: a climax, a divergence, a lower high and a broken low."}),
 S("guess",{q:"Which two trades belong to a range?",o:["The edge holds (fade it) or the edge breaks (breakout)","Only trend continuation","Only trend termination"],a:0,e:"In a range you either bet the edges hold or that one finally gives way. Remember: most breakouts fail."}),
 S("drill",{kind:"trade4",n:1}),
 S("explain",{q:"Pick one of the four trades and say where its stop goes, and why.",model:"Trend continuation: under the pullback's low, because if that breaks the trend may not be continuing. Range edge: just outside the edge. Breakout: back inside the range."})],
 cards:[{q:"In the markup stage, which trade fits best?",o:["Trend continuation: buy pullbacks","Short every new high","Short the breakouts"],a:0,e:"In markup the trend is your friend. Buy pullbacks to support or a moving average."},
  {pic:"failbo",q:"You bought a breakout, and price closes back inside the range. You should…",o:["Get out: the breakout trade has failed","Buy more","Wait a month"],a:0,e:"A breakout trade is wrong once price is back in the range. Failed breakouts often run to the other side."}],chart:["trade4"]},

{id:"l22",n:22,lv:3,t:"Trends, ranges and the shift between them",min:10,steps:[
 S("hook",{text:"Markets switch between calm and wild. The calm usually comes before the big move, and you can see it coming."}),
 S("guess",{q:"A market has gone quiet: the candles have been shrinking for weeks. What often comes next?",o:["A bigger move, but you can't know which way yet","More quiet forever","A crash, always"],a:0,e:"Volatility comes in cycles: quiet spells tend to be followed by bursts. A squeeze says a move is coming, not its direction.",ex:"bb"}),
 S("learn",{title:"Bollinger Bands",svg:"bb",text:"A 20-period average with bands 2 standard deviations above and below. They narrow when price is calm (a squeeze) and widen when it moves fast. Price riding the upper band is strength in a trend, not \"too high\"."}),
 S("drill",{kind:"squeeze",n:2}),
 S("guess",{pic:"bands:squeeze",q:"A range breaks out and the bands suddenly widen as price runs. The read?",o:["Volatility is expanding: a trend move has likely started","The breakout has failed","Sell: price is outside the band"],a:0,e:"Expansion after a squeeze is how new trends start. Fading it just because price is outside the band fights fresh momentum."}),
 S("guess",{q:"How do trends usually end?",o:["Either a climax spike, or slowly rolling over into a range","Always with a perfect head and shoulders","They never end"],a:0,e:"Some trends end in a blow-off: a sudden huge move and a sharp reversal. Others lose steam and go sideways; that range then becomes a top or just a pause."}),
 S("guess",{q:"Which tools fit which market?",o:["Trends: moving averages and pullbacks. Ranges: edges and oscillators","Oscillators for trends, MAs for ranges","The same tools everywhere"],a:0,e:"Match the tool to the market. MAs whipsaw in ranges; oscillators fight strong trends."}),
 S("guess",{q:"ADX measures trend strength. ADX above 25 and rising means…",o:["A strong trend: favour trend tools","A range: trade the edges","Price is going up"],a:0,e:"ADX shows how strong a trend is, not which way. Under about 20 there's no real trend."}),
 S("drill",{kind:"trend",n:1}),
 S("drill",{kind:"squeeze",n:1}),
 S("explain",{q:"Why does a quiet, tight market often come before a big move?",model:"Buyers and sellers are in balance and orders pile up just outside the range. When one side wins, stops and breakout orders fire together, so the move comes fast.",ex:"bb"})],
 cards:[{pic:"bands:squeeze",q:"A Bollinger squeeze tells you…",o:["A bigger move is likely, not which way","Price will go up","Price will go down"],a:0,e:"Wait for the break, and use the other side of the squeeze for your stop."},
  {pic:"bands:walk",q:"Price keeps closing near the upper Bollinger Band for weeks. That's…",o:["A strong uptrend, not a sell signal on its own","An automatic short","A squeeze"],a:0,e:"In strong trends price \"walks the band\". Only a break of the swing structure says the trend is over."}],chart:["squeeze"]},

{id:"l23",n:23,lv:3,t:"Multiple timeframe analysis",min:10,steps:[
 S("hook",{text:"The same coin can be in an uptrend and a downtrend at once. It depends on the timeframe, so good traders always check more than one."}),
 S("guess",{pic:"tf2:Daily:fall",q:"The daily chart is in a strong uptrend. The 1-hour chart is falling. That 1-hour fall is most likely…",o:["A pullback inside the daily uptrend","A new long-term downtrend","Unrelated to the daily"],a:0,e:"The higher timeframe is the tide, the lower one the waves. A falling 1-hour chart in a daily uptrend is usually a dip to buy, once it ends."}),
 S("learn",{title:"Tide, waves and ripples",svg:"mtf",text:"Pick your trading chart, then one about 4 to 6 times higher for the trend and one 4 to 6 times lower for timing. Trade in the higher chart's direction; use the lower one to time the entry and place a tight stop."}),
 S("guess",{q:"You trade the 4-hour chart. With a factor of about 4 to 6, your trend chart is the…",o:["Daily","15-minute","Monthly"],a:0,e:"4 hours × 6 = 24 hours: the daily. For timing you'd drop to about the 1-hour."}),
 S("drill",{kind:"mtf",n:2}),
 S("guess",{pic:"tf2:Daily:lhll",q:"The daily is in an uptrend, but the 4-hour just made a lower high and a lower low. What now?",o:["Wait: buy once the 4-hour turns back up","Short it with full size","Buy right now"],a:0,e:"Let the lower timeframe finish its pullback. A higher low and a break above its last lower high is the turn."}),
 S("guess",{q:"Support on the weekly chart or support on the 15-minute chart: which matters more?",o:["The weekly","The 15-minute","They're equal"],a:0,e:"Higher-timeframe levels were built by more trading over more time, so more traders care about them."}),
 S("drill",{kind:"mtf",n:1}),
 S("explain",{q:"Why trade in the direction of the higher timeframe?",model:"Its trend carries more weight, so pullbacks against it usually end and the trend resumes. Trading with it puts the bigger flow on my side."})],
 cards:[{q:"Timeframes disagree and you can't tell which way the bigger trend points. Best plan?",o:["Stand aside, or trade smaller","Trade bigger to make up for it","Flip a coin"],a:0,e:"No clear tide means no trend edge. Waiting is a position too."},
  {q:"Your stop is usually placed using…",o:["The lower timeframe's swing points, so it can be tight","The monthly chart","A fixed 10%, always"],a:0,e:"The higher chart picks the direction; the lower chart shows the exact spot where the idea is wrong."}],chart:["mtf"]},

{id:"l24",n:24,lv:3,t:"Long-term charts",min:9,steps:[
 S("hook",{text:"Zoom out. Weekly and monthly charts show the trend that daily noise hides, and the levels everyone remembers."}),
 S("guess",{q:"BTC drops 25% in three weeks, but it's still above a rising 40-week MA after a year of gains. On the big picture this is…",o:["A pullback in a long-term uptrend","Surely the start of a bear market","Nothing worth noticing"],a:0,e:"Crypto bull markets have had several 20 to 35% drops along the way. The big trend only turns when the major swings break and the long average rolls over.",ex:"big"}),
 S("tool",{kind:"log"}),
 S("learn",{title:"Reading the big picture",svg:"lt",text:"Use log scale on long charts so equal % moves look equal. A long average like the 40-week splits bull from bear. Weekly levels and trendlines outrank anything on a daily chart."}),
 S("drill",{kind:"big",n:2}),
 S("guess",{q:"BTC's past cycle tops came about 12 to 18 months after its halvings (2013, 2017, 2021). How much should you trust that?",o:["A little: three cycles is a tiny sample, and it can change","Completely: it's a law","Not at all: it never happened"],a:0,e:"It's held so far, but three or four cycles could be partly luck, and a pattern everyone knows tends to get traded early."}),
 S("guess",{q:"BTC's 200-week MA has often been near past bear-market lows, but in 2022 price fell well below it. The lesson?",o:["Treat it as an area of interest, not a guaranteed floor","It always holds","It's useless"],a:0,e:"Long averages show where long-term buyers have stepped in before. No level is a promise."}),
 S("drill",{kind:"big",n:1}),
 S("explain",{q:"Why look at the weekly chart before trading the daily?",model:"The weekly shows the main trend and the levels that matter most. A daily setup that agrees with the weekly has the bigger flow behind it."})],
 cards:[{q:"For stocks, the 200-day MA is roughly the…",o:["40-week MA","20-week MA","200-week MA"],a:0,e:"Stocks trade about 5 days a week: 200 ÷ 5 = 40 weeks. Crypto trades all 7 days, so for coins the 200-day is closer to a 29-week average."},
  {pic:"longsup",q:"A support level that held on the monthly chart for years…",o:["Matters far more than one from the 1-hour chart","Is weaker because it's old","Only matters to investors"],a:0,e:"Higher-timeframe levels have more trading, and more memory, behind them."},
  {q:"Why use log scale on a 10-year BTC chart?",o:["So a 50% move looks the same size at $1,000 and at $60,000","It makes price look higher","Log only works for stocks"],a:0,e:"On a normal scale early moves look flat and recent ones huge. Log shows the % changes that matter to your money."}],chart:["big"]},

{id:"l25",n:25,lv:3,t:"Intermarket analysis and breadth",min:10,steps:[
 S("hook",{text:"No market moves alone. Money flows between the dollar, bonds, stocks, commodities and crypto, and those flows leave clues."}),
 S("guess",{q:"The US dollar is rising strongly. For crypto and commodities this has often been…",o:["A headwind","A big tailwind","Irrelevant"],a:0,e:"A stronger dollar tightens money worldwide. It's a tendency, not a law: these links come and go."}),
 S("learn",{title:"The classic links",svg:"inter",text:"Dollar up, commodities tend to fall. Rising bond yields (falling bond prices) tend to weigh on stocks. Since about 2020, BTC has often moved with tech stocks. These links strengthen and fade, so check them; don't assume them."}),
 S("guess",{q:"The ETH/BTC chart is falling, but ETH is up 10% in dollars. What's true?",o:["ETH rose less than BTC: BTC was the stronger buy","ETH fell in dollars","ETH beat BTC"],a:0,e:"A ratio chart shows relative strength. Falling ETH/BTC means BTC did better, even though both went up.",ex:"ratio"}),
 S("drill",{kind:"rel",n:2}),
 S("learn",{title:"Breadth",svg:"breadth",text:"Breadth asks how many are joining the move. If an index or BTC makes a new high while fewer stocks or coins join in, the rally is narrowing. It's a warning, like a divergence."}),
 S("guess",{pic:"breadth",q:"An index makes a new high, but the advance-decline line makes a lower high. That's…",o:["Narrowing breadth: fewer stocks are carrying the rally","Very healthy","A buy signal"],a:0,e:"Strong rallies are broad. When a few leaders carry the index alone, it's more fragile."}),
 S("guess",{q:"In past crypto bull markets, money has often moved in which order?",o:["BTC first, then ETH, then smaller coins","Small coins first, then BTC","All at once"],a:0,e:"Often, not always. BTC dominance and ETH/BTC show whether money is moving out toward riskier coins."}),
 S("drill",{kind:"rel",n:1}),
 S("explain",{q:"Why look at ratio charts, not just each coin's own chart?",model:"A ratio shows which one is stronger. If I'm going to buy something, I want what's beating the rest, not something that's only rising because everything is."})],
 cards:[{q:"BTC dominance rising means…",o:["BTC is gaining share of the total crypto market","BTC's price is rising","Altcoins are doing better"],a:0,e:"Dominance is BTC's share of total market cap. It can rise in a falling market if altcoins fall faster."},
  {q:"A link between BTC and the Nasdaq is best treated as…",o:["Something that changes: check the recent relationship","A fixed law","Always zero"],a:0,e:"Correlations shift with the market. Look at what's happening now, not an old headline."}],chart:["rel"]},

{id:"l26",n:26,lv:3,t:"Point and figure, Elliott Wave, cycles",min:10,steps:[
 S("hook",{text:"Three older methods many traders still use. Each has a useful idea inside it, and a trap."}),
 S("learn",{title:"Point and figure",svg:"pf",text:"Only price moves count, not time. A column of X's for rises, O's for falls. Each box is a set amount (say $1,000 for BTC). A new column starts only when price turns by 3 boxes. That filters out noise."}),
 S("guess",{q:"Box size $1,000, 3-box reversal. BTC's X column tops at $64,000, then price falls to $61,500. New O column?",o:["No: it needs a fall to $61,000 (3 boxes)","Yes","Only on a Monday"],a:0,e:"3 boxes × $1,000 = $3,000 below the top, so $61,000. A fall to $61,500 is only 2.5 boxes. The X column stays.",svg:"pf"}),
 S("guess",{q:"A point and figure \"double top buy\" signal happens when…",o:["An X column rises above the top of the previous X column","Two O columns line up","Price touches a moving average"],a:0,e:"It's a breakout above the last high, with the noise filtered out by the box size. Simple and clear."}),
 S("learn",{title:"Elliott Wave",svg:"ew",text:"Trends move in 5 waves (1 to 5), corrections in 3 (A, B, C). Three rules: wave 2 never goes below the start of wave 1, wave 3 is never the shortest of 1, 3 and 5, and wave 4 never drops into wave 1's price area."}),
 S("drill",{kind:"ew",n:2}),
 S("guess",{q:"What's the biggest problem with Elliott Wave?",o:["Counts are subjective: experts often disagree until after the fact","It has no rules at all","It only works on gold"],a:0,e:"The rules help, but in real time there are usually several valid counts. Use it as a map of possibilities, never as proof."}),
 S("guess",{q:"An analyst finds tops roughly every 40 days over the past year. Best use?",o:["A loose timing hint, confirmed by price","Sell exactly on day 40","Ignore price and follow the cycle"],a:0,e:"Cycles stretch and shrink, and even random data shows cycles that look real. Let price confirm before acting."}),
 S("drill",{kind:"coin",n:1}),
 S("explain",{q:"What useful idea can you keep from point and figure, Elliott Wave and cycles, and what's the trap?",model:"P&F: filter noise to see clean breakouts. Elliott: trends move in pushes and pullbacks. Cycles: rough timing windows. The trap is treating any of them as certain. Price has the final say."})],
 cards:[{q:"In Elliott Wave, which wave is often the longest and strongest?",o:["Wave 3","Wave 2","Wave B"],a:0,e:"Wave 3 is often the longest, and it can never be the shortest of 1, 3 and 5."},
  {q:"Point and figure charts ignore…",o:["Time: a column only grows when price moves at least one box","Price","Highs and lows"],a:0,e:"Quiet days add nothing to the chart. Only moves of at least one box count."}],chart:["ew"]}
);

l18:`
<section><h4>What a moving average is</h4>
<p>The average closing price of the last N candles, recalculated every candle. It smooths out the noise so you can see the trend.</p>
<ul><li><b>Simple (SMA):</b> every close counts the same.</li>
<li><b>Exponential (EMA):</b> newer closes count more, so it turns sooner.</li></ul>
<figure class="dg">${svgMA()}<figcaption>The average follows price, but always a little behind.</figcaption></figure></section>
<section><h4>The lengths people watch</h4>
<div class="tw"><table><tr><th>Length</th><th>Job</th></tr>
<tr><td>20</td><td>Short-term trend; strong trends pull back to it</td></tr>
<tr><td>50</td><td>Medium-term trend</td></tr>
<tr><td>200</td><td>Long-term trend; bull above, bear below</td></tr></table></div>
<p>Short averages are quick but give many false signals. Long ones are smooth but late. There's no perfect length.</p></section>
<section><h4>How to read them</h4>
<ul><li><b>Slope first:</b> rising MA = up, falling = down, flat = no trend.</li>
<li><b>Price above a rising MA:</b> uptrend. Dips to the MA are often bought.</li>
<li><b>Fast above slow</b> (20 over 50): up bias. <b>Golden cross</b>: 50 crosses above 200. <b>Death cross</b>: 50 below 200. Both are slow and late.</li>
<li><b>In ranges</b> the lines go flat and tangle, and every crossover is a whipsaw.</li></ul></section>
<div class="remember"><b>Remember</b>A moving average describes the trend; it doesn't predict it. Use it in trending markets and ignore its crossovers in ranges.</div>`,

l19:`
<section><h4>What an oscillator does</h4>
<p>An oscillator measures the <b>speed</b> of price, squeezed into a fixed scale. It answers "how hard is price pushing?", not "which way is the trend?".</p></section>
<section><h4>RSI (Relative Strength Index)</h4>
<ul><li>Usually 14 periods, scale 0 to 100.</li>
<li><b>Over 70</b> overbought (rose fast), <b>under 30</b> oversold (fell fast).</li>
<li>In strong uptrends RSI often stays between 40 and 80; in downtrends between 20 and 60. Overbought in an uptrend is strength, not a sell.</li></ul></section>
<section><h4>Divergence</h4>
<figure class="dg">${svgDiv()}<figcaption>Higher high in price, lower high in RSI: bearish divergence.</figcaption></figure>
<ul><li><b>Bearish:</b> price higher high, RSI lower high. The push up is weakening.</li>
<li><b>Bullish:</b> price lower low, RSI higher low. The selling is weakening.</li>
<li>A divergence is a warning. Wait for the swing structure to break before acting.</li></ul></section>
<section><h4>Stochastics</h4>
<p>%K = where the close sits in the last 14 candles' high-low range (0 = at the low, 100 = at the high). %D is a 3-period average of %K.</p>
<ul><li>Over 80 overbought, under 20 oversold.</li><li>Signal: %K crossing %D inside those zones.</li></ul>
<figure class="dg">${svgStoch()}<figcaption>A cross in the overbought zone near a range top.</figcaption></figure></section>
<div class="remember"><b>Remember</b>Oscillators shine in ranges. In trends, use them in the trend's direction: buy oversold dips in an uptrend, don't short overbought.</div>`,

l20:`
<section><h4>The three parts of MACD</h4>
<ul><li><b>MACD line</b> = 12 EMA − 26 EMA.</li>
<li><b>Signal line</b> = 9-period EMA of the MACD line.</li>
<li><b>Histogram</b> = MACD line − signal line.</li></ul>
<figure class="dg">${svgMACD()}<figcaption>Bars shrink as the rise slows, before the lines cross.</figcaption></figure></section>
<section><h4>How to read it</h4>
<ul><li><b>Above zero:</b> the fast average is above the slow one, an up bias. Below zero: down bias.</li>
<li><b>MACD crossing its signal</b> is a momentum shift. Crosses in the trend's direction are the better ones.</li>
<li><b>Shrinking histogram:</b> momentum is fading. It turns before the lines cross, and often before price turns.</li>
<li><b>Divergence</b> works like RSI: new price high, lower MACD high.</li></ul></section>
<section><h4>Momentum (rate of change)</h4>
<p>Momentum = close now − close N candles ago. Above zero and rising: the move is speeding up. Momentum tends to peak <b>before</b> price, which is what makes it an early warning.</p>
<p>Worked example: 12 EMA 105, 26 EMA 100, signal 6. MACD = 5, histogram = 5 − 6 = −1, so momentum is slowing.</p></section>
<div class="remember"><b>Remember</b>All of these are built from price. They help you see the speed of a move, but the swings and levels on the chart still decide the trade.</div>`,

l21:`
<section><h4>The cycle, again</h4>
<figure class="dg">${svgCycle()}<figcaption>Accumulation, markup, distribution, markdown.</figcaption></figure>
<p>Each stage favours different trades. Markup and markdown favour going with the trend. Accumulation and distribution are ranges.</p></section>
<section><h4>The four trades</h4>
<figure class="dg">${svgFour()}<figcaption>Every trade is one of these four.</figcaption></figure>
<div class="tw"><table><tr><th>Trade</th><th>Bet</th><th>Stop</th></tr>
<tr><td>Trend continuation</td><td>The trend carries on after a pullback</td><td>Under the pullback low</td></tr>
<tr><td>Trend termination</td><td>The trend is ending</td><td>Beyond the extreme</td></tr>
<tr><td>Level holds</td><td>A range edge holds again</td><td>Just outside the edge</td></tr>
<tr><td>Level breaks</td><td>The edge finally gives way</td><td>Back inside the range</td></tr></table></div></section>
<section><h4>Which ones win most?</h4>
<ul><li>Trends tend to continue, so continuation trades are the bread and butter.</li>
<li>Termination trades win least often. They need a climax, a divergence, a lower high and a broken low.</li>
<li>Most breakouts fail, so a breakout needs pressure building first (tight range, rising lows, volume).</li></ul></section>
<div class="remember"><b>Remember</b>Before any trade, say which of the four it is. That tells you what has to happen for you to be wrong, and where the stop goes.</div>`,

l22:`
<section><h4>Calm, then wild</h4>
<p>Volatility (how much price moves) comes in waves. Quiet spells tend to be followed by bursts, and bursts by calm. A tight, quiet market is often building up to a move.</p></section>
<section><h4>Bollinger Bands</h4>
<p>A 20-period SMA with a band <b>2 standard deviations</b> above and below. About 95% of closes sit inside.</p>
<figure class="dg">${svgBB()}<figcaption>Squeeze, then expansion.</figcaption></figure>
<ul><li><b>Squeeze:</b> bands at their narrowest in months. A bigger move is likely; the direction isn't known.</li>
<li><b>Expansion:</b> bands widening fast as price runs. A trend move is underway.</li>
<li><b>Walking the band:</b> in a strong trend price can hug the upper band for weeks. That's strength.</li></ul></section>
<section><h4>How trends end</h4>
<ul><li><b>Climax:</b> a sudden, huge move and a sharp reversal.</li>
<li><b>Rolling over:</b> the pushes get weaker, price goes sideways, and the range becomes a top or a pause.</li></ul></section>
<section><h4>Match the tool to the market</h4>
<div class="tw"><table><tr><th>Market</th><th>Use</th><th>Avoid</th></tr>
<tr><td>Trend</td><td>MAs, pullbacks, breakouts in the trend's direction</td><td>Shorting "overbought"</td></tr>
<tr><td>Range</td><td>Edges, oscillators</td><td>MA crossovers</td></tr></table></div>
<p><b>ADX</b> measures trend strength (not direction): over 25 and rising = strong trend, under 20 = no trend.</p></section>
<div class="remember"><b>Remember</b>A squeeze tells you to get ready, not which way to bet. Let the break show the direction.</div>`,

l23:`
<section><h4>Tide, waves and ripples</h4>
<figure class="dg">${svgMTF()}<figcaption>The higher chart sets the direction; the lower chart times the entry.</figcaption></figure>
<ul><li><b>Trend chart</b> (higher): which way to trade.</li>
<li><b>Trading chart</b>: your setups.</li>
<li><b>Timing chart</b> (lower): the exact entry and a tight stop.</li></ul>
<p>Use a factor of about <b>4 to 6</b> between them.</p>
<div class="tw"><table><tr><th>You trade</th><th>Trend chart</th><th>Timing chart</th></tr>
<tr><td>15-minute</td><td>1-hour</td><td>~3-minute</td></tr>
<tr><td>1-hour</td><td>4-hour</td><td>15-minute</td></tr>
<tr><td>4-hour</td><td>Daily</td><td>1-hour</td></tr>
<tr><td>Daily</td><td>Weekly</td><td>4-hour</td></tr></table></div></section>
<section><h4>How to use them together</h4>
<ul><li>Trade in the direction of the higher chart.</li>
<li>A move against it on the lower chart is usually a pullback. Wait for it to end: a higher low and a break of its last lower high (in an uptrend).</li>
<li>Levels on higher charts matter more.</li>
<li>If the charts disagree and you can't tell the bigger trend, stand aside or trade smaller.</li></ul></section>
<div class="remember"><b>Remember</b>Direction from above, timing from below.</div>`,

l24:`
<section><h4>Why zoom out</h4>
<p>Weekly and monthly charts show the main trend without daily noise. Their levels and trendlines were built over years and outrank anything on a daily chart.</p>
<figure class="dg">${svgLT()}<figcaption>A 25% drop inside a long uptrend is a pullback on the weekly chart.</figcaption></figure></section>
<section><h4>Tools for long charts</h4>
<ul><li><b>Log scale:</b> equal % moves look equal. Always use it for multi-year crypto charts.</li>
<li><b>Long averages:</b> the 40-week (about the 200-day for stocks) splits bull from bear. BTC's 200-week MA has often been near past bear-market lows, but price fell well below it in 2022, so treat it as an area, not a floor.</li>
<li>Crypto bull markets have had several 20 to 35% drops on the way up. The big trend turns only when the major swings break and the long average rolls over.</li></ul></section>
<section><h4>The four-year pattern, with care</h4>
<p>BTC's past tops came about 12 to 18 months after its halvings (2013, 2017, 2021). That's three or four examples: a tiny sample. It may not repeat, and a pattern everyone knows tends to get traded early.</p></section>
<div class="remember"><b>Remember</b>Start every analysis on the weekly chart. Then zoom in.</div>`,

l25:`
<section><h4>The classic links</h4>
<figure class="dg">${svgInter()}<figcaption>Tendencies, not laws.</figcaption></figure>
<ul><li><b>Dollar up</b> → commodities and risk assets tend to struggle.</li>
<li><b>Bond yields up</b> (bond prices down) → tends to weigh on stocks, especially tech.</li>
<li><b>Crypto:</b> since about 2020, BTC has often moved with tech stocks. The link comes and goes, so check it.</li></ul></section>
<section><h4>Ratio charts (relative strength)</h4>
<p>Divide one price by another: ETH/BTC, SOL/ETH, a stock vs its index. <b>Rising ratio:</b> the first one is beating the second. It says nothing about whether either rose in dollars.</p>
<p><b>BTC dominance</b> is BTC's share of the total crypto market cap. Falling dominance while the market rises often means money is moving into altcoins.</p></section>
<section><h4>Breadth</h4>
<figure class="dg">${svgBreadth()}<figcaption>Index makes a new high; fewer members join in.</figcaption></figure>
<ul><li><b>Advance-decline line:</b> running total of rising minus falling stocks.</li>
<li><b>% above the 50-day MA</b>: how many members are in their own uptrend.</li>
<li>New high with weaker breadth = a narrow rally, like a divergence. Healthy rallies are broad.</li></ul></section>
<div class="remember"><b>Remember</b>Buy the strongest thing in the strongest group, and check that the whole market agrees.</div>`,

l26:`
<section><h4>Point and figure</h4>
<figure class="dg">${svgPF()}<figcaption>X columns for rises, O columns for falls. Time is ignored.</figcaption></figure>
<ul><li><b>Box size:</b> how much price each X or O stands for (for example $1,000 on BTC).</li>
<li><b>3-box reversal:</b> a new column only starts when price turns by 3 boxes.</li>
<li><b>Double top buy:</b> an X column rises above the previous X column's top. Double bottom sell: the mirror.</li>
<li>Worked example: top at $64,000, box $1,000. A new O column needs $61,000 or lower.</li></ul></section>
<section><h4>Elliott Wave</h4>
<figure class="dg">${svgEW()}<figcaption>Five waves with the trend, three against.</figcaption></figure>
<p>The three rules of a 5-wave move:</p>
<ol><li>Wave 2 never goes past the start of wave 1.</li><li>Wave 3 is never the shortest of 1, 3 and 5.</li><li>Wave 4 never enters wave 1's price area.</li></ol>
<p>The trap: in real time there are several valid counts, and experts disagree. Use it as a map of what could happen, never as proof.</p></section>
<section><h4>Cycles</h4>
<p>Markets show rough rhythms, like BTC's four-year pattern. But cycles stretch and shrink, and even random data shows cycles that look real. Use them as loose timing windows and let price confirm.</p></section>
<div class="remember"><b>Remember</b>Every method here is a lens, not a crystal ball. If price disagrees with your count or your cycle, price wins.</div>`

const LEVELS=[{n:1,gate:"gate",lessons:8},{n:2,gate:"gate2",lessons:9},{n:3,gate:"gate3",lessons:9}];
const lvlLessons=n=>LESSONS.filter(L=>L.lv===n);
const lvlLessonsDone=n=>lvlLessons(n).every(L=>state.done[L.id]);
/* a level opens once every lesson of the level before has been finished and its test passed */
function lvlOpen(n){if(n<=1)return true;const p=LEVELS.find(x=>x.n===n-1);return !!p&&lvlLessonsDone(n-1)&&!!state.done[p.gate]&&n<=LEVELS.length}
function topLevel(){let n=1;while(lvlOpen(n+1))n++;return n}
function nextLesson(){return LESSONS.find(L=>lvlOpen(L.lv)&&!state.done[L.id])}
function curLevel(){const nx=nextLesson();return nx?nx.lv:topLevel()}
function lvlT(n){state.lvT=state.lvT||{};return state.lvT[n]=state.lvT[n]||{}}
function lvlStart(n){const t=lvlT(n);if(!t.s){t.s=Date.now()}}
function lvlEnd(n){const t=lvlT(n);if(!t.e){t.e=Date.now();if(!t.s)t.s=t.e}}

  if(t&&t.e&&t.s)return "Completed in "+days(t.s,t.e)+pr+".";if(t&&t.s)return "Started "+days(t.s,Date.now())+" ago"+pr+".";return ""}

/* ---------- RSI divergence ---------- */
function divGen(kind){/* kind: bear | bull | none */
  for(let t=0;t<60;t++){const base=100,warm=[[16,base+jit(0,2)]];const a=rint(14,20),pb=rint(6,9);
    const legs=kind==="none"?[[rint(9,12),base+a*.7],[pb,base+a*.7-rint(4,6)],[rint(6,8),base+a*1.25],[3,base+a*1.15]]
      :[[rint(6,8),base+a],[pb,base+a-rint(6,8)],[rint(13,17),base+a+rint(1,3)],[3,base+a-2]];
    const r=pathBars(base,warm.concat(legs),.35,.003);let b=r.bars;const mir=kind==="bull"||(kind==="none"&&R()<.5);if(mir)b=mirrorBars(b,2*base);
    const p1=r.ends[1],p2=r.ends[3];const ext=(i,hiSide)=>{let best=i;for(let k=Math.max(0,i-2);k<=Math.min(b.length-1,i+2);k++)if(hiSide?b[k].h>b[best].h:b[k].l<b[best].l)best=k;return best};
    const top=!mir;const i1=ext(p1,top),i2=ext(p2,top);const rs=rsiA(closes(b));const v1=rs[i1],v2=rs[i2];if(v1==null||v2==null)continue;
    const px1=top?b[i1].h:b[i1].l,px2=top?b[i2].h:b[i2].l;const newExt=top?px2>px1:px2<px1;if(!newExt)continue;
    const momUp=top?v2>v1:v2<v1;/* momentum agrees with price */
    if(kind==="none"&&momUp&&Math.abs(v2-v1)>3)return{bars:b,i1,i2,top,kind};
    if(kind!=="none"&&!momUp&&Math.abs(v2-v1)>5)return{bars:b,i1,i2,top,kind}}
  return null}
function rsiRound(el,done,opts={}){let want=pick(["bear","bull","none"]);let d=rwDiv(want)||divGen(want);if(!d){want="bear";d=divGen("bear")||divGen("none");want=d.kind}

  const cv=h("canvas",{class:"chart"});const f=h("div",{hidden:""});
  mountChart(cv,()=>{const o=Object.assign({},g.o);if(shown){const pv=i=>d.top?g.bars[i].h:g.bars[i].l;const rv=i=>g.o.osc.series[0].v[i];const col=want==="none"?"--good":"--mark";
    o.tlines=[{a:{i:i1,p:pv(i1)},b:{i:i2,p:pv(i2)},c:col}];o.osc=Object.assign({},g.o.osc,{lines:[{a:{i:i1,v:rv(i1)},b:{i:i2,v:rv(i2)},c:col}]})}return[g.bars,o]});
  const names={bear:"Bearish divergence: higher price high, lower RSI high",bull:"Bullish divergence: lower price low, higher RSI low",none:"No divergence: RSI agrees with price"};const tag=rwTag(d);
  const {row,btns}=optRow(names,["bear","bull","none"],k=>{const ok=markPick(btns,k,want);shown=true;rerenderAll();
    fb(f,ok?"good":"bad",(ok?"Correct. ":"Not quite. ")+(want==="bear"?"Price made a <b>higher high</b>, but RSI peaked <b>lower</b>. The second push had less force. A warning, not yet a sell: the last swing low still has to break.":want==="bull"?"Price made a <b>lower low</b>, but RSI bottomed <b>higher</b>. The selling is running out of force. Wait for price to confirm with a break of the last lower high.":"Price made a new "+(d.top?"high":"low")+" and RSI made a new "+(d.top?"high":"low")+" with it. Momentum <b>agrees</b> with the move, so there's no warning here.")+tag);done(ok)});
  el.append(h("p",{class:"task"},opts.prompt||"Compare the last two "+(d.top?"peaks":"dips")+" in price with RSI underneath. What do you see?"),cv,row,f)}

/* ---------- MACD: is momentum growing or fading? ---------- */
function macdGen(kind){for(let t=0;t<60;t++){const legs=kind==="fade"?[[30,100+jit(0,1)],[rint(10,13),116+rint(0,4)],[rint(6,8),121+rint(0,2)],[rint(8,10),124+rint(0,2)]]:[[30,100+jit(0,1)],[rint(10,13),104+rint(0,2)],[rint(8,10),107+rint(0,2)],[rint(8,10),121+rint(0,4)]];
    const r=pathBars(100,legs,.3,.003);let b=r.bars;const down=R()<.5;if(down)b=mirrorBars(b,200);const m=macdA(closes(b));const n=b.length-1;const H=m.hist;if(H[n-6]==null)continue;
    const s=down?-1:1;const grow=s*H[n]>s*H[n-6]&&s*H[n]>0&&s*m.m[n]>0;const fade=s*H[n]<s*H[n-6]-.05&&s*m.m[n]>0;

/* ---------- the four trades ---------- */
function trade4Gen(kind){const lo=100,hi=110;const rng=[[7,hi-R()],[6,lo+R()],[7,hi-R()],[6,lo+R()],[7,hi-R()*.8]];let legs,mark;

/* ---------- squeeze or expansion ---------- */
function bbGen(kind){for(let t=0;t<40;t++){const c=[100];const N1=70;for(let i=1;i<=N1;i++){const p=c[i-1];c.push(p*(1+(gauss()*1+(100-p)/p*100*.1)/100))}
    if(kind==="sq"){for(let i=0;i<rint(26,32);i++){const p=c[c.length-1];c.push(p*(1+(gauss()*.28+(c[N1]-p)/p*100*.15)/100))}}
    else{const d=R()<.5?1:-1;for(let i=0;i<rint(8,12);i++){const p=c[c.length-1];c.push(p*(1+(gauss()*.25+(c[N1]-p)/p*100*.15)/100))}for(let i=0;i<rint(9,12);i++){const p=c[c.length-1];c.push(p*(1+(d*1.5+gauss()*1.1)/100))}}
    const b=barsFromCloses(c,.004);const bb=bollA(closes(b));const n=b.length-1;const bw=i=>(bb.up[i]-bb.dn[i])/bb.mid[i];const w=[];for(let i=20;i<=n;i++)w.push(bw(i));const med=w.slice().sort((x,y)=>x-y)[w.length>>1];
    if(kind==="sq"&&bw(n)<.55*med&&bw(n)<=Math.min(...w)*1.15)return b;if(kind==="ex"&&bw(n)>1.6*med&&bw(n)>2*bw(n-10))return b}return null}

    const want=rat[rat.length-1].c>rat[0].o?"a":"b";const pa=Math.round((ga-1)*100),pb=Math.round((gb-1)*100);const sg=x=>(x>=0?"+":"")+x+"%";

/* ---------- Elliott Wave: is the count valid? ---------- */
function ewGen(kind){const a=rint(10,14),p0=100,p1=p0+a;let p2,p3,p4,p5;
  if(kind==="w2"){p2=p0-rint(2,4);p3=p2+a*1.7;p4=p3-(p3-p2)*.35;p5=p4+a*1.1}
  else if(kind==="w3"){p2=p1-a*.5;const c=a*1.35;p3=p2+a*.82;p4=Math.max(p1+.8,p3-(p3-p2)*.22);p5=p4+c}
  else if(kind==="w4"){p2=p1-a*.55;p3=p2+a*1.7;p4=p1-a*.35;p5=p4+a*1.3}
  else{p2=p1-a*rint(45,62)/100;p3=p2+a*rint(150,180)/100;p4=Math.max(p1+a*.15,p3-(p3-p2)*rint(30,40)/100);p5=p4+a*rint(80,110)/100}
  const pts=[p1,p2,p3,p4,p5];const r=pathBars(p0-3,[[4,p0]].concat(pts.map((p,k)=>[k%2?rint(5,7):rint(7,10),p])).concat([[4,p5-a*.4]]),.18,.002);let b=r.bars;const down=R()<.5;const M=2*p0+20;if(down)b=mirrorBars(b,M);
  const idx=[r.ends[0]].concat(r.ends.slice(1,6));const labels=idx.map((i,k)=>{const top=k%2===1;const hiSide=down?!top:top;return{i,p:hiSide?b[i].h:b[i].l,below:!hiSide,text:String(k),c:"--accent"}});

/* ---------- "What would you do?": a real chart stops at a random candle. Buy, sell or stand aside, then watch what happened next.
   Every trade gets the same rules: stop 1.5 ATR away, target 2x the risk, 25 candles to work. ---------- */
const SC={ctx:48,fut:25,stopA:1.5,tgtR:2};
function atrAt(b,i,n){n=n||14;let s=0,k=0;for(let j=Math.max(1,i-n+1);j<=i;j++){s+=Math.max(b[j].h-b[j].l,Math.abs(b[j].h-b[j-1].c),Math.abs(b[j].l-b[j-1].c));k++}return k?s/k:b[i].h-b[i].l}
function scSim(b,i0,dir,risk){const e=b[i0].c,stop=e-dir*risk,tgt=e+dir*risk*SC.tgtR;
  for(let j=i0+1;j<b.length;j++){const x=b[j];if(dir>0?x.l<=stop:x.h>=stop)return{r:-1,at:j,how:"stop",stop,tgt};if(dir>0?x.h>=tgt:x.l<=tgt)return{r:SC.tgtR,at:j,how:"target",stop,tgt}}
  return{r:dir*(b[b.length-1].c-e)/risk,at:b.length-1,how:"time",stop,tgt}}
function scPick(){const n=SC.ctx+SC.fut;
  for(let k=0;k<80&&RW.sets.length;k++){const set=pick(RW.sets);if(set.bars.length<n+5)continue;const s=rint(0,set.bars.length-n);const raw=set.bars.slice(s,s+n);
    const b=raw.map(x=>({o:x.o,h:x.h,l:x.l,c:x.c}));if(b.some(x=>!(x.h>=x.l)))continue;return{bars:b,meta:{sym:set.sym,iv:set.iv,t:raw[0].t}}}
  return{bars:(R()<.5?genMarketLike(n-1):genSwing(pick(["up","down","side"]),n-1)).slice(0,n),meta:null}}
/* plain reading of the chart at the decision point: trend and where price sits in its recent range */
function scRead(b,i0){const ctx=b.slice(Math.max(0,i0-59),i0+1);const t=rwClassify(ctx);const rec=b.slice(Math.max(0,i0-39),i0+1);const hi=Math.max(...rec.map(x=>x.h)),lo=Math.min(...rec.map(x=>x.l));const pos=(b[i0].c-lo)/(hi-lo||1);
  const where=pos>.75?"near the top of its recent range":pos<.25?"near the bottom of its recent range":"in the middle of its recent range";
  return{trend:t,pos,text:(t==="up"?"an uptrend (higher highs and higher lows)":t==="down"?"a downtrend (lower highs and lower lows)":t==="side"?"a sideways range":"no clear trend")+", with price "+where}}
function scProcess(act,rd){if(act==="aside")return rd.trend==="up"||rd.trend==="down"?{ok:true,t:"Standing aside is never a mistake, though this chart had a clear trend you could have traded with."}:{ok:true,t:"No clear edge here, so standing aside was the patient choice."};
  const dir=act==="buy"?1:-1;if(rd.trend==="up"||rd.trend==="down"){const w=(rd.trend==="up")===(dir>0);return w?{ok:true,t:"Good process: you traded with the trend."}:{ok:false,t:"You traded against the trend. That can work, but it needs a strong reason, like a clear reversal at a big level."}}
  if(rd.trend==="side"){const edge=dir>0?rd.pos<.3:rd.pos>.7;return edge?{ok:true,t:"Good process: in a range you "+(dir>0?"bought near support":"sold near resistance")+"."}:{ok:false,t:"In a range, the middle is the worst place to trade: there's no level to lean on."}}
  return{ok:false,t:"With no clear trend, a trade here is closer to a coin flip."}}
/* the candle pattern (if any) that finished in the last 3 candles before the box */
function scCandle(b,i0){const kinds=["mstar","bengulf","pierce","bharami","hammer","ihammer","r3","doji"];
  for(const mir of [false,true]){const v=mir?rwMir(b):b;const a=rwAtr(v);
    for(let i=i0;i>=Math.max(12,i0-2);i--)for(const kind of kinds){if(mir&&kind==="doji")continue;const r=rwCdlAt(v,i,a,kind);if(!r)continue;
      const key=mir?RW_CMIR[kind]:kind;const bull=kind==="doji"?false:(key===kind);return{key,bull,from:r[0],to:r[0]+r[1]-1,n:SET13.includes(key)?13:12}}}
  return null}
/* what to study after a missed scenario: lessons + notes slides, also pinned in the Notes tab */
function scStudy(k,rd,pr,cd,ok){const out=[];const add=(n,hint)=>{const L=LESSONS.find(x=>x.n===n);if(!L||!lvlOpen(L.lv)||out.some(x=>x.n===n))return;out.push({n,L,slide:studySlide(L,hint)})};
  const dir=k==="buy"?1:k==="sell"?-1:0;
  if(cd){const sideOK=dir===0||(cd.key==="r3"?dir>0:cd.key==="f3"?dir<0:(cd.bull?dir>0:dir<0));if(!sideOK||!ok)add(cd.n,CDL[cd.key].n+" "+CDL[cd.key].e)}
  if(!pr.ok){if(rd.trend==="up"||rd.trend==="down"){add(6,"trade with the trend higher highs higher lows lower highs lower lows uptrend downtrend");add(22,"trend trade with the trend pullback")}
    else if(rd.trend==="side"){add(7,"support resistance buy near support sell near resistance");add(11,"trading range middle edges buy low sell high range")}
    else{add(6,"no clear trend sideways stand aside");add(22,"range trend shift stand aside")}}
  if(!ok&&!out.length)add(8,"one trade risk stop many trades process losses");
  return out}
function scPinSave(list){if(!list.length)return;state.study=state.study||{};const v=state.study.scen=state.study.scen||{t:Date.now(),lv:null,items:[]};v.t=Date.now();
  list.forEach(x=>{if(v.items.some(it=>!it.seen&&it.n===x.n&&it.slide===x.slide))return;v.items.push({id:Math.random().toString(36).slice(2,9),n:x.n,slide:x.slide,seen:false,qi:-1,kind:LESSON_ROUND[x.n]||null})});
  v.lv=Math.max(...v.items.map(it=>(LESSONS.find(L=>L.n===it.n)||{lv:1}).lv))}
const fmtR=r=>(r>=0?"+":"−")+Math.abs(r).toFixed(1)+"R";
function scenarioRound(el,done){const g=scPick();const b=g.bars,i0=SC.ctx-1;const risk=SC.stopA*atrAt(b,i0);let vis=SC.ctx,lines=[];
  const cv=h("canvas",{class:"chart scen"});let shown=false;
  /* before you choose, only the past is drawn, so the candles fill the chart and stay easy to read */
  let cdl=null;mountChart(cv,()=>shown?[b,{visible:vis,box:{from:i0,to:i0,c:"--accent"},hlines:lines,labels:cdl?[{i:cdl.from,p:cdl.bull?Math.min(...b.slice(cdl.from,cdl.to+1).map(x=>x.l)):Math.max(...b.slice(cdl.from,cdl.to+1).map(x=>x.h)),below:cdl.bull,text:CDL[cdl.key].n,c:"--mark"}]:[]}]:[b.slice(0,SC.ctx),{box:{from:i0,to:i0,c:"--accent"}}]);
  const f=h("div",{hidden:""});const btns={};const nm={buy:"Buy",sell:"Sell (short)",aside:"Stand aside"};
  const row=h("div",{class:"row"},...Object.keys(nm).map(k=>btns[k]=h("button",{on:{click:()=>answer(k)}},nm[k])));
  const src=g.meta?`Real ${g.meta.sym} ${g.meta.iv==="D"?"daily":"4-hour"} chart`:"Practice chart";
  el.append(h("p",{class:"task",html:src+". It stops at the boxed candle. What would you do?"}),cv,row,h("p",{class:"hint"},"Each trade: stop 1.5 ATR away, target 2× the risk, 25 candles to work."),f);
  function answer(k){Object.values(btns).forEach(x=>x.disabled=true);btns[k].classList.add("pick-good");
    const L=scSim(b,i0,1,risk),S=scSim(b,i0,-1,risk);const res={buy:L.r,sell:S.r,aside:0};const mine=res[k];const best=Object.keys(res).reduce((a,c)=>res[c]>res[a]?c:a,"aside");
    const rd=scRead(b,i0);const pr=scProcess(k,rd);const e=b[i0].c;
    if(k!=="aside"){const r=k==="buy"?L:S;lines=[{p:e,c:"--muted",w:1,label:"entry"},{p:r.stop,c:"--bad",w:1.5,dash:true,label:"stop"},{p:r.tgt,c:"--good",w:1.5,dash:true,label:"target"}]}
    const end=k==="buy"?L.at:k==="sell"?S.at:b.length-1;shown=true;
    /* play the future candle by candle */
    const step=()=>{vis=Math.min(end+1,vis+1);rerenderAll();if(vis<end+1)setTimeout(step,45);else finish()};setTimeout(step,120);
    function finish(){vis=b.length;rerenderAll();
      const ok=k===best||mine>0;const how=r=>r.how==="target"?"hit the target, "+fmtR(r.r):r.how==="stop"?"stopped out, −1R":"ran out of time at "+fmtR(r.r);
      const cd=scCandle(b,i0);cdl=cd;rerenderAll();const study=(!ok||!pr.ok)?scStudy(k,rd,pr,cd,ok):[];scPinSave(study);
      state.scen=state.scen||{n:0,r:0,good:0};const sc=state.scen;sc.n++;sc.r=+(sc.r+mine).toFixed(2);if(pr.ok)sc.good++;save();
      const cdTxt=cd?`<br>🕯 The last candles before the box made a <b>${CDL[cd.key].n}</b> (labelled), a ${cd.key==="r3"?"continuation-up":cd.key==="f3"?"continuation-down":cd.bull?"bullish":"bearish"} sign.`:"";
      const stTxt=study.length?`<div class="scstudy"><b>📌 Study again</b>${study.map(x=>`<div><span class="n">Lesson ${x.n}</span> ${x.L.t}${x.slide&&x.slide!==x.L.t?": "+x.slide:""}</div>`).join("")}<span class="hint">Pinned in the Notes tab.</span></div>`:"";
      fb(f,ok?"good":"bad",`<b>${k==="aside"?"You stood aside: 0R.":"You "+(k==="buy"?"bought":"sold")+": "+how(k==="buy"?L:S)+"."}</b> `+
        (k!=="buy"?"Buying would have "+how(L)+". ":"")+(k!=="sell"?"Selling would have "+how(S)+". ":"")+
        `<br>Before the box: ${rd.text}. ${pr.t}${cdTxt}${stTxt}<br><span class="scstat">One trade proves nothing; good process wins over many. Your scenarios: ${sc.n} played, ${fmtR(sc.r)} total, ${sc.good} with good process.</span>`+(g.meta?rwTag(g):""));
      done(ok)}}}

function exPic(key){if(key.indexOf("cdl:")===0){const c=cdlFigure(key);return c?picWrap(c):null}
  let x;try{x=exMake(key)}catch(e){return null}const o=x.o||{};let bars=x.bars;
  const o2={zones:o.zones,box:o.box,vol:o.vol,hlines:(o.hlines||[]).map(l=>Object.assign({},l,{label:""})),tlines:/^tline/.test(key)?[]:(o.tlines||[]).map(l=>Object.assign({},l,{label:""}))};
