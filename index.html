l1:`
<section><h4>The three ideas every chart reader starts from</h4>
<ol>
<li><b>Price discounts everything.</b> News, earnings, rumours, fear and hope all end up in the price. The chart is a summary of what everyone believes right now.</li>
<li><b>Prices move in trends.</b> Once a move starts, it tends to keep going more often than it reverses. Most chart methods try to catch a trend early and stay in it.</li>
<li><b>History repeats.</b> Not the exact prices, but the behaviour. People react to fear and greed the same way they did a hundred years ago, so the same shapes keep appearing.</li>
</ol></section>
<section><h4>Why patterns exist at all</h4>
<p>"The market" is just thousands of traders of every size, each trying to beat the others. Their decisions are part analysis, part emotion. When fear or greed pushes buying and selling out of balance, price moves, and that imbalance leaves a footprint on the chart.</p>
<p>The market is cruelly designed: it turns our instincts against us. That urge to sell everything in a panic at the low? It's not bad luck. The panic of everyone selling together is what creates the low.</p></section>
<section><h4>But most of the time, price is close to random</h4>
<p>Academic theory says prices take in new information so fast that the next move is a coin flip. That is mostly true. A trader's edge lives in the small moments when it isn't true, and even then the edge is small.</p>
<figure class="dg">${svgEdge()}<figcaption>Realistic edges look like the middle bar. Nobody gets the bottom one on timeframes a person can trade.</figcaption></figure></section>
<section><h4>Why most traders fail</h4>
<ul><li>They trade a method that has no edge. You can't escape probability in the long run.</li>
<li>They expect to be good in months. A realistic learning curve is 3 to 5 years.</li>
<li>They start with too little money, so normal losses knock them out.</li></ul>
<p>Working on your mindset won't fix a method that doesn't work. A calm loser is still a loser.</p></section>
<div class="remember"><b>Remember</b>Your eyes will find patterns in pure noise. You'll prove that to yourself in the drill below. A pattern is only worth trading once it has shown an edge over many examples.</div>`,

<section><h4>Charles Dow's six rules</h4>
<ol>
<li><b>The averages discount everything.</b> The index already reflects all known news.</li>
<li><b>The market has three trends</b>, like the sea: a tide, the waves, and the ripples (table below).</li>
<li><b>Big trends have three phases</b> (diagram below).</li>
<li><b>Averages must confirm each other.</b> Dow wanted the Industrials and the Railroads both making new highs before calling a bull market. Crypto version: BTC and ETH both breaking out is stronger than one alone.</li>
<li><b>Volume must confirm the trend.</b> In an uptrend, volume grows on rallies and shrinks on dips.</li>
<li><b>A trend is in force until it clearly reverses.</b> The odds favour the existing trend continuing.</li>
</ol></section>
<section><h4>The three trends</h4>
<div class="tw"><table><tr><th>Trend</th><th>Like the sea's…</th><th>Typical length</th><th>Notes</th></tr>
<tr><td>Primary</td><td>Tide</td><td>Over a year</td><td>The one to trade with</td></tr>
<tr><td>Secondary</td><td>Waves</td><td>3 weeks to 3 months</td><td>Corrections that usually give back 1/3 to 2/3 of the last move, most often about half</td></tr>
<tr><td>Minor</td><td>Ripples</td><td>Under 3 weeks</td><td>Mostly noise; used for timing entries</td></tr></table></div></section>
<section><h4>The phases of a big move</h4>
<p>Dow described a bull market in three phases. Traders today usually draw the whole cycle in four stages, adding the fall that follows.</p>
<figure class="dg">${svgCycle()}<figcaption>Who is buying or selling in each stage. The informed money acts first; the public arrives late.</figcaption></figure>
<ul><li><b>Accumulation:</b> news is still bad and nobody wants to buy. Informed investors quietly buy from people giving up.</li>
<li><b>Markup (public participation):</b> price rises fast, news improves, trend followers jump on.</li>
<li><b>Distribution:</b> headlines are glowing, everyone is talking about it. The early buyers sell to the late ones.</li>
<li><b>Markdown:</b> sellers take over and price falls, often faster than it rose.</li></ul></section>
<section><h4>The hardest call</h4>
<p>The most difficult job for any trend follower is telling a normal pullback apart from the first leg of a new trend in the other direction. Lesson 6 gives you the rule for it.</p></section>
<div class="remember"><b>Remember</b>Don't try to call the top or bottom. Trade with the primary trend and wait for clear proof before you believe it has turned.</div>`,

<section><h4>How to read a candle</h4>
<p>Every candle shows four prices for its period: open, high, low and close. The thick part is the <b>real body</b>, from open to close. The thin lines are the <b>shadows</b> (or wicks), reaching to the high and low.</p>
<figure class="dg">${svgCandle()}<figcaption>Green: closed above where it opened. Red: closed below.</figcaption></figure>
<ul><li><b>Long body:</b> one side was in control all period.</li>
<li><b>Small body</b> (a "spinning top"): neither side won. Indecision.</li>
<li><b>Doji:</b> open and close almost equal. Strong indecision, important after a long trend.</li>
<li><b>Long upper shadow:</b> price went up but was pushed back down. Sellers showed up.</li>
<li><b>Long lower shadow:</b> price dropped but buyers pushed it back. Buyers showed up.</li></ul>
<p>When you look at a candle, ask: where did it close inside its range? Is it bigger or smaller than the candles before it? Did anything surprise you? Telling the "story" of each candle like this trains your eye.</p></section>
<section><h4>Line, bar and candle charts</h4>
<p>All three show the same data. A line chart uses only closing prices, which is great for seeing the big picture. Bar and candle charts show the full range. Candles make the open-to-close fight easier to see at a glance, which is why most traders use them.</p></section>
<section><h4>Linear or log scale</h4>
<figure class="dg">${svgLog()}<figcaption>Both moves are +100%. Only the log scale shows them as equal.</figcaption></figure>
<p>Use log scale for anything that has grown many times over, like BTC since 2015. On a linear scale, old moves look tiny and recent ones look huge, which distorts everything you draw.</p></section>
<section><h4>Timeframes and your chart setup</h4>
<ul><li>Use three timeframes about 4 to 6 times apart: weekly for context, daily for the plan, 4-hour for timing.</li>
<li>Keep the same simple setup on every market and timeframe, so your eye learns to see consistently.</li>
<li>Price first. Add indicators only when they earn their place (Level 3).</li></ul></section>
<div class="remember"><b>Remember</b>A candle is the result of a fight between buyers and sellers. Read who won, by how much, and whether that's a change from the candles before it.</div>`,

l4:`
<section><h4>Every market has two prices</h4>
<p>The <b>bid</b> is the highest price a buyer is offering. The <b>ask</b> (or offer) is the lowest price a seller will take. The gap between them is the <b>spread</b>. If the bid is 49.95 and the ask 50.05, you buy at 50.05 and could only sell straight back at 49.95, so you start every trade slightly down.</p>
<figure class="dg">${svgBook()}<figcaption>An order book. Buying "at market" takes the cheapest ask; a limit buy waits in the bids.</figcaption></figure>
<p>A <b>liquid</b> market (BTC, ETH) has a tight spread and lots of orders stacked up, so big orders barely move the price. An <b>illiquid</b> one (a small coin) has a wide spread and a thin book, so even a modest order can push price around. A wider spread also signals uncertainty.</p></section>
<section><h4>Order types</h4>
<div class="tw"><table><tr><th>Order</th><th>What it does</th><th>Watch out for</th></tr>
<tr><td>Market</td><td>Fills right now at the best available price</td><td>You pay the spread, and in thin markets slippage</td></tr>
<tr><td>Limit</td><td>Fills only at your price or better</td><td>May never fill if price doesn't come to you</td></tr>
<tr><td>Stop</td><td>Becomes a market order once price touches your level. Used to cut losses or enter breakouts</td><td>In a fast drop it can fill well below your stop</td></tr>
<tr><td>Stop-limit</td><td>Becomes a limit order once triggered</td><td>In a crash it may not fill at all</td></tr></table></div>
<p>Buying with a limit order is patient. Buying at market shows urgency. Lots of urgent buying at the ask says more about conviction than the price change alone.</p></section>
<section><h4>Who is on the other side of your trade</h4>
<ul><li><b>Big players</b> (funds, banks, crypto "whales") do 70 to 90% of the volume in most markets. They build positions slowly and quietly, usually inside sideways ranges, then move price fast once they're ready. They tend to buy when price is below what they think it's worth, which is often when retail traders are scared.</li>
<li><b>Market makers</b> post both bids and asks, earn the spread, and are mostly algorithms today.</li>
<li><b>Retail traders</b> (people like you) mostly use charts. Your edge is flexibility: you can act fast and in small size where big players can't.</li></ul>
<p>Not all buying is bullish. A miner hedging future coins or a fund balancing a portfolio may trade for reasons that have nothing to do with direction.</p></section>
<section><h4>The real cost of a trade</h4>
<div class="formula">Round-trip cost = spread + (fee × 2)</div>
<p>With a 0.05% spread and a 0.1% fee each way, every trade starts 0.25% down. Make 200 trades a year and that's 50% of a position's value paid in costs. Trading less and in liquid markets is the cheapest edge there is.</p></section>
<div class="remember"><b>Remember</b>You pay the spread and fees on every trade, win or lose. Use limit orders where you can, stick to liquid coins, and know exactly how your stop order behaves in a fast market.</div>`,

l5:`
<section><h4>Pivots: the building blocks of structure</h4>
<p>A <b>pivot high</b> is a candle whose high is above the highs of the candles next to it. A <b>pivot low</b> is a candle whose low is below its neighbours. They mark where buyers or sellers ran out of steam.</p>
<figure class="dg">${svgPivot()}<figcaption>Left: a simple pivot high. Right: a bigger pivot, a pivot high with lower pivot highs on both sides.</figcaption></figure>
<ul><li><b>First-order pivot:</b> higher than the one candle on each side. You'll find lots of these, many just noise.</li>
<li><b>Second-order pivot:</b> a first-order pivot high with lower first-order pivot highs on each side. These mark the more important turns.</li>
<li><b>In the drill below</b> you mark major swing points: a high above the 3 candles on each side, or a low below them. It's a quick filter that keeps only the turns that matter.</li></ul></section>
<section><h4>Swings: the skeleton of every chart</h4>
<p>Join pivot highs and pivot lows in turn and you get <b>swings</b>. Strip a chart back to its swings and the trend, the ranges and the key levels suddenly become obvious. Every later lesson builds on this.</p>
<figure class="dg">${svgSwings()}<figcaption>The same price, reduced to its swings.</figcaption></figure></section>
<section><h4>How to practise</h4>
<ul><li>Mark pivots the same way every time. Inconsistent marking makes every later lesson guesswork.</li>
<li>Do a little every day. A few minutes a day for two weeks beats hours in one sitting.</li>
<li>Try charting by hand: write down the daily close of 3 to 5 coins and sketch the swings. It builds feel quickly.</li></ul></section>
<div class="remember"><b>Remember</b>The clear peaks and troughs matter. Small wiggles inside a swing don't. When in doubt, zoom out.</div>`,

<section><h4>Three directions, not two</h4>
<figure class="dg">${svgTrends()}<figcaption>Read the trend from the swing points: HH higher high, HL higher low, LH lower high, LL lower low.</figcaption></figure>
<ul><li><b>Uptrend:</b> each rally goes higher than the last, and each dip stops higher than the last.</li>
<li><b>Downtrend:</b> lower highs and lower lows.</li>
<li><b>Sideways (range):</b> highs and lows go nowhere. Markets spend at least a third of their time like this.</li></ul>
<p>You have three choices: buy, sell, or stand aside. Most trend tools lose money in sideways markets, so in a range standing aside is often the smart choice.</p></section>
<section><h4>Which trend do you mean?</h4>
<p>Trends sit inside each other. The weekly can be up while the daily is pulling back and the 4-hour is falling hard. When someone says "the trend is down", always ask: on which timeframe? Most trend traders follow the trend that lasts weeks to months and use the shorter one only to time entries.</p></section>
<section><h4>How a trend ends</h4>
<figure class="dg">${svgFailure()}<figcaption>An uptrend fails: the rally at C can't beat A, then price breaks the low at B. The break at S is the signal.</figcaption></figure>
<ol><li><b>First warning:</b> a rally fails to beat the previous high, or a dip falls all the way to the previous low.</li>
<li><b>Confirmation:</b> price then breaks the last swing low (in an uptrend). Now you have a lower high and a lower low.</li></ol>
<p>One warning sign isn't a reversal. A lower high on its own may just mean the trend is turning into a range.</p></section>
<div class="remember"><b>Remember</b>Name the trend from the swing points, not from the last few candles. Assume it continues until both a lower high and a lower low (or the reverse) appear.</div>`,

l7:`
<section><h4>What support and resistance are</h4>
<p><b>Support</b> is a price area below the market where buying has been strong enough to stop a fall, usually a previous swing low. <b>Resistance</b> is an area above where selling has stopped a rise, usually a previous swing high.</p></section>
<section><h4>Why they work: people remember prices</h4>
<p>Say price bounces from 100 and rallies to 120. Now picture three groups:</p>
<ul><li><b>Buyers at 100</b> are happy and wish they'd bought more. They'll buy if it comes back.</li>
<li><b>Sellers at 100</b> know they're wrong. They'll buy back to get out at break-even if it comes back.</li>
<li><b>People who missed it</b> promise to buy the next dip.</li></ul>
<p>All three have a reason to buy near 100. That's what support is: a cluster of buy orders waiting under the market. Resistance is the same story in reverse.</p></section>
<section><h4>Role reversal</h4>
<figure class="dg">${svgFlip()}<figcaption>Once resistance is clearly broken, the old ceiling often becomes the new floor.</figcaption></figure>
<p>When support breaks, everyone who bought there is now losing. Their old buy orders turn into sell orders on the way back up, so old support becomes resistance. The same happens the other way round.</p></section>
<section><h4>Which levels matter most</h4>
<div class="tw"><table><tr><th>Stronger when…</th><th>Why</th></tr>
<tr><td>Price spent a long time there</td><td>More people traded and remember it</td></tr>
<tr><td>Volume was heavy there</td><td>More money is tied to that price</td></tr>
<tr><td>It's recent</td><td>Traders' memories and positions are fresher</td></tr>
<tr><td>It's a round number</td><td>People place orders at 50,000 and 100,000, not 49,873</td></tr>
<tr><td>It was touched several times</td><td>Many swing points cluster there</td></tr></table></div></section>
<section><h4>A healthy dose of doubt</h4>
<ul><li>Draw <b>zones</b>, not thin lines. Price rarely turns at the exact cent.</li>
<li>Levels break all the time, especially in a strong trend. In an uptrend, resistance is usually broken eventually.</li>
<li>Tests show price reacts at random lines more often than people expect. Treat a level as a place to pay attention, not a place where price must turn.</li></ul></section>
<div class="remember"><b>Remember</b>Draw the few levels where several swing points cluster. Then watch how price behaves there. The reaction is the signal, not the line.</div>`,

<section><h4>Expected value: the only number that matters</h4>
<div class="formula">EV = (win rate × average win) − (loss rate × average loss)</div>
<p>Measure wins and losses in <b>R</b>, where 1R is the amount you risk per trade. Win 40% of the time at 2R and lose 1R the other 60%, and EV = 0.4 × 2 − 0.6 × 1 = <b>+0.2R per trade</b>. Risking $100, that's about +$20 a trade on average, but any single run of 100 trades can look very different, as the simulator shows.</p>
<p>A high win rate means nothing on its own. Winning 60% at 0.5R loses money: 0.6 × 0.5 − 0.4 × 1 = −0.1R.</p></section>
<section><h4>Position size comes from your stop</h4>
<div class="formula">Size = (account × risk %) ÷ (entry − stop)</div>
<p>Example: a $10,000 account risking 1% has $100 at risk. Buy BTC at 60,000 with a stop at 57,600 and the risk per coin is $2,400, so the size is 100 ÷ 2,400 = 0.042 BTC. If the stop is closer, the size gets bigger. Your risk stays $100 either way.</p>
<ul><li>Professional traders risk 0.5 to 1% per trade. Ask "how much should I risk?", never "how much can I afford to buy?"</li>
<li>Put the stop where the trade idea is proven wrong (just past support), then size the position to fit. A typical trend trader's stop is about 1.5 to 2 times the coin's average daily move (ATR).</li>
<li>Wild coins get smaller positions. The coins that rise fastest usually fall hardest.</li></ul></section>
<section><h4>Spreading money across coins isn't enough</h4>
<p>Someone who put $1,000 into each of ten popular coins on 1 January 2018 would have lost about 61% by July. Crypto coins crash together, so ten coins is closer to one big bet than ten small ones. Stops and position sizing protect you. Owning lots of coins doesn't.</p></section>
<section><h4>The maths of losing</h4>
<figure class="dg">${svgDrawdown()}<figcaption>The gain you need to get back to where you started after a loss.</figcaption></figure>
<p>Losing streaks are normal. At a 40% win rate you will see 8 or more losses in a row over a few hundred trades. At 1% risk that's a dent of about 8%. At 5% risk it's about a third of your account.</p></section>
<div class="remember"><b>Remember</b>Decide your risk before you think about profit. Keep trading money separate from your long-term monthly investing, and never risk more than 1% on one idea while you're learning.</div>`
};

l9:`
<section><h4>What a trendline is</h4>
<p>A straight line that joins the swing points of a trend. In an <b>uptrend</b> it runs under the rising swing lows. In a <b>downtrend</b> it runs along the falling swing highs.</p>
<figure class="dg">${svgTline()}<figcaption>Two points draw the line. The third touch is what confirms it.</figcaption></figure></section>
<section><h4>How to draw it well</h4>
<ul><li>Use clear swing points, not random candles.</li>
<li>Go through as many swing points as you can. A few wicks poking through is fine; slicing through candle bodies is not.</li>
<li>Draw on a log scale for anything that has moved a lot, like BTC.</li></ul></section>
<section><h4>How important is a line?</h4>
<ul><li><b>Touches:</b> the more times price has bounced off it, the more it matters.</li>
<li><b>Length:</b> a line that has held for months beats one from last week.</li>
<li><b>Angle:</b> steep lines (much steeper than 45°) break soon. The trend often carries on at a gentler angle after.</li></ul></section>
<section><h4>When the line breaks</h4>
<p>A clear <b>close</b> through the line is an early warning, not proof. The trend is only over when the swing structure breaks too: a lower high and a lower low in an uptrend.</p>
<p>A broken uptrend line often turns into resistance later, the same way broken support does.</p></section>
<section><h4>Channels</h4>
<p>Draw a line parallel to the trendline across the peaks. Price often swings between the two lines.</p>
<figure class="dg">${svgChannel()}<figcaption>A rally that falls short of the channel line is a sign the trend is tiring.</figcaption></figure></section>
<div class="remember"><b>Remember</b>Lines are drawn by people, so different people draw them differently. Trust a line more when it has many touches and the swing structure agrees.</div>`,

l10:`
<section><h4>Why pullbacks matter</h4>
<p>Trends move in waves: a push, a pullback, another push. The pullback is where most trend traders get in. The hard part is telling a normal pullback from the start of a reversal.</p></section>
<section><h4>The ⅓ to ⅔ rule</h4>
<p>Measure the last swing from its start to its end. A normal pullback gives back <b>between a third and two thirds</b> of it, most often about half.</p>
<figure class="dg">${svgRetr()}<figcaption>The shaded band is where most healthy pullbacks stop.</figcaption></figure>
<div class="tw"><table><tr><th>Pullback</th><th>Reads as</th></tr>
<tr><td>Under ⅓</td><td>Strong trend; buyers barely let it dip</td></tr>
<tr><td>⅓ to ⅔</td><td>Normal, healthy pullback</td></tr>
<tr><td>Over ⅔</td><td>Trend in doubt; watch the last swing low</td></tr></table></div></section>
<section><h4>Fibonacci levels</h4>
<p>Many traders use 38.2% and 61.8%. They sit inside the same ⅓ to ⅔ zone. Treat them as a zone, not magic numbers. 50% isn't a Fibonacci ratio; it's just the most common pullback size.</p>
<p>Quick math: rise from 2,000 to 3,000. 61.8% back = 3,000 − 0.618 × 1,000 = 2,382.</p></section>
<section><h4>The shape of a healthy pullback</h4>
<ul><li>Often <b>two legs</b>: down, a small bounce, down again.</li>
<li>Quiet, overlapping candles, often on lower volume.</li>
<li>Holds above the last swing low (in an uptrend).</li></ul>
<p>Warning signs: big, fast candles against the trend, a pullback that goes past ⅔, or a break of the last swing low.</p></section>
<div class="remember"><b>Remember</b>Depth and speed both matter. A deep, fast pullback is far more dangerous than a deep, slow one.</div>`,

l11:`
<section><h4>Ranges are normal</h4>
<p>Markets spend at least a third of their time going sideways between support and resistance. A range means buyers and sellers are roughly in balance.</p></section>
<section><h4>Trading inside a range</h4>
<ul><li>Buy near support, sell near resistance. Fading the edges works more often than chasing breakouts.</li>
<li>Avoid the middle: there's no reason for anyone to act there, and no clean place for a stop.</li>
<li>Trend tools (like trendlines and moving averages) lose money in ranges.</li></ul></section>
<section><h4>Breakout or fake-out?</h4>
<figure class="dg">${svgFake()}<figcaption>Watch where the candles close, not where the wicks reach.</figcaption></figure>
<ul><li><b>Real breakout:</b> closes outside the range and keeps going, often on bigger volume. It often comes back to retest the old edge from the other side.</li>
<li><b>Fake-out:</b> pokes out, then closes back inside. Breakout buyers are trapped, and their selling pushes price toward the other side.</li></ul></section>
<section><h4>Which breakouts work better</h4>
<ul><li>Pressure building at one edge first: rising lows into resistance, or falling highs into support.</li>
<li>A tight, coiled range rather than a wide, messy one.</li>
<li>Volume picking up on the break.</li></ul>
<p>Classic target: add the range's height to the breakout point. Range 100 to 110, break above 110: target about 120.</p></section>
<div class="remember"><b>Remember</b>Most breakouts from ranges fail. A breakout needs proof: a close outside, follow-through, and ideally volume.</div>`,

l12:`
<section><h4>Why candle patterns work at all</h4>
<p>Each candle shows who won that period. Some shapes show one side suddenly losing control. They only mean something <b>after a clear move</b>: a reversal pattern needs something to reverse.</p></section>
<section><h4>The eight to know</h4>
<figure class="dg">${svgC12()}<figcaption>Top row: one-candle patterns. Bottom row: two-candle patterns. The three candles before each show the trend.</figcaption></figure></section>
<section><h4>One-candle patterns</h4>
<ul><li><b>Hammer</b> (after a fall): small body at the top, lower shadow at least twice the body. Buyers rejected the lows.</li>
<li><b>Hanging man</b> (after a rise): the same shape. Needs a lower close next to confirm.</li>
<li><b>Shooting star</b> (after a rise): small body at the bottom, long upper shadow. Sellers rejected the highs.</li>
<li><b>Inverted hammer</b> (after a fall): the shooting-star shape. Needs a higher close next to confirm.</li></ul>
<p>Same shape, different name: the trend before it decides.</p></section>
<section><h4>Two-candle patterns</h4>
<ul><li><b>Bullish engulfing</b>: after a fall, a green body that fully covers the last red body.</li>
<li><b>Bearish engulfing</b>: after a rise, a red body that fully covers the last green body.</li>
<li><b>Dark cloud cover</b>: after a rise, a red candle opens above the last high and closes below the middle of the green body.</li>
<li><b>Piercing pattern</b>: after a fall, a green candle opens below the last low and closes above the middle of the red body.</li></ul>
<p>Engulfing is stronger than dark cloud or piercing, because the second body covers all of the first.</p></section>
<div class="remember"><b>Remember</b>A candle pattern is a hint about who's in control right now. It doesn't tell you how far price will go.</div>`,

l13:`
<section><h4>Stars</h4>
<p>A star is a small body set apart from a big candle before it. It shows the trend stalling.</p>
<ul><li><b>Morning star</b> (bottom): big red, small star below, big green closing deep into the red body.</li>
<li><b>Evening star</b> (top): big green, small star above, big red closing deep into the green body.</li></ul>
<p>Stronger when there are gaps around the star and the third candle closes deep into the first one.</p></section>
<section><h4>Harami and doji</h4>
<ul><li><b>Harami</b>: a small body inside the previous big body. The move has lost steam. Weaker than engulfing: it says "slowing", not "reversed".</li>
<li><b>Doji</b>: open and close almost equal. After a long trend it's a warning that the winning side has stalled. In a range it means little.</li></ul>
<figure class="dg">${svgC13()}<figcaption>Stars, harami and doji show a trend pausing. Rising three methods shows it continuing.</figcaption></figure></section>
<section><h4>Continuation candles</h4>
<ul><li><b>Rising three methods</b>: a big green candle, three small candles drifting down inside its range, then a new big green high. The uptrend continues.</li>
<li><b>Falling three methods</b>: the mirror image in a downtrend.</li></ul></section>
<section><h4>Windows (gaps)</h4>
<p>Japanese traders call a gap between candles a <b>window</b>. A rising window tends to act as support when price comes back to it. A falling window tends to act as resistance.</p></section>
<div class="remember"><b>Remember</b>Ask two questions every time: was there a clear trend before it, and what did the next candle do?</div>`,

l14:`
<section><h4>Confluence</h4>
<p>A candle signal on its own is weak. When it appears <b>at a place that already matters</b>, two separate clues agree. That's confluence, and it's where an edge can live.</p>
<figure class="dg">${svgConf()}<figcaption>Level first, candle second. The candle tells you the level is holding right now.</figcaption></figure></section>
<section><h4>Good places for a signal</h4>
<ul><li>Support or resistance zones that have held before.</li>
<li>A trendline or channel line.</li>
<li>The end of a normal pullback (⅓ to ⅔ back).</li>
<li>Old resistance that turned into support (and the reverse).</li></ul></section>
<section><h4>Places to ignore</h4>
<ul><li>The middle of a range.</li>
<li>Right under resistance for a buy, or right above support for a sell: there's no room to profit.</li></ul></section>
<section><h4>Turning a signal into a plan</h4>
<ul><li><b>Stop:</b> just past the pattern's extreme. Under a hammer's low; above a shooting star's high.</li>
<li><b>Room:</b> check the distance to the next level. If the reward is smaller than the risk, skip it.</li>
<li><b>Confirmation:</b> the next candle moving your way adds proof.</li></ul></section>
<div class="remember"><b>Remember</b>Candles give timing, not targets. Use levels and patterns to decide where price might go.</div>`,

l15:`
<section><h4>Reversal patterns</h4>
<p>These shapes show a trend running out of fuel. None of them is complete until price breaks a key line. Until then, the trend is still in force.</p></section>
<section><h4>Head and shoulders</h4>
<figure class="dg">${svgHS()}<figcaption>The neckline joins the two dips. The pattern completes on a close below it.</figcaption></figure>
<ul><li>Left shoulder, a higher head, then a lower right shoulder: the first lower high.</li>
<li>Volume is often lighter on the head and right shoulder.</li>
<li><b>Target:</b> head-to-neckline height, projected down from the break. Head 130, neckline 110: target 90.</li>
<li>Price often makes a <b>return move</b> to the neckline, which now acts as resistance.</li>
<li>The <b>inverse</b> version marks a bottom and breaks up through its neckline.</li></ul></section>
<section><h4>Double tops and bottoms</h4>
<ul><li><b>Double top</b>: two peaks at about the same price. Confirmed only when price closes below the low between them.</li>
<li><b>Double bottom</b>: the mirror image. Confirmed on a close above the high between the two lows.</li>
<li>Target: the pattern's height, projected from the break. Lows at 80, middle high 95: target about 110.</li></ul></section>
<section><h4>When patterns fail</h4>
<p>If price breaks the wrong way, for example above both peaks of a "double top", the pattern has failed. Failed patterns are often strong signals in the other direction. Respect the break, not the textbook.</p></section>
<div class="remember"><b>Remember</b>Don't sell the right shoulder or the second peak. Wait for the neckline or middle-low break: that's the proof.</div>`,

l16:`
<section><h4>Continuation patterns</h4>
<p>Most patterns are pauses, not reversals. The trend catches its breath, then usually carries on in the same direction.</p>
<figure class="dg">${svgCont()}<figcaption>Triangles coil; flags drift against a sharp move.</figcaption></figure></section>
<section><h4>Triangles</h4>
<ul><li><b>Ascending</b>: flat top, rising lows. Usually breaks up.</li>
<li><b>Descending</b>: flat bottom, falling highs. Usually breaks down.</li>
<li><b>Symmetrical</b>: lower highs and higher lows. Neutral; usually breaks in the direction of the trend before it.</li>
<li>Breakouts work best roughly half to three quarters of the way into the triangle. At the tip, the pattern often fizzles.</li></ul></section>
<section><h4>Flags and pennants</h4>
<ul><li>A sharp move (the <b>pole</b>), then a short, tight drift against it.</li>
<li>Short: a few candles to a few weeks. If it drags on, it's something else.</li>
<li><b>Target:</b> the pole's height added to the breakout. "Flags fly at half-mast": the move after is often as big as the move before.</li></ul></section>
<section><h4>Rectangles</h4>

<section><h4>What volume tells you</h4>
<p>Volume is how much traded in each candle. It shows how many people were behind a move. Big moves on big volume are believable; big moves on small volume are suspect.</p>
<figure class="dg">${svgVol()}<figcaption>Healthy uptrend: volume grows on rallies and shrinks on dips.</figcaption></figure></section>
<section><h4>Volume rules</h4>
<ul><li>Volume should grow <b>in the direction of the trend</b>.</li>
<li>A breakout on heavy volume is more believable. On thin volume, wait for a retest.</li>
<li>A new high on fading volume is a warning that buyers are tiring.</li>
<li>A huge volume spike with a long wick after a long move often marks a <b>climax</b>: the panic low or the euphoric top.</li></ul></section>
<section><h4>Open interest (futures)</h4>
<p>Open interest is the number of futures contracts still open. Each has a buyer and a seller.</p>
<div class="tw"><table><tr><th>Price</th><th>Open interest</th><th>Reads as</th></tr>
<tr><td>Up</td><td>Up</td><td>New longs: healthy</td></tr>
<tr><td>Up</td><td>Down</td><td>Shorts covering: may run out of fuel</td></tr>
<tr><td>Down</td><td>Up</td><td>New shorts: healthy downtrend</td></tr>
<tr><td>Down</td><td>Down</td><td>Longs closing or being liquidated</td></tr></table></div></section>
<section><h4>Crypto specifics</h4>
<ul><li>Volume is split across many exchanges and some is inflated. Compare rising and falling volume on one big exchange, not exact totals.</li>
<li>Perpetual futures have a <b>funding rate</b>. Very high funding plus rising open interest means crowded leveraged longs, which can unwind in a fast flush.</li></ul></section>
<div class="remember"><b>Remember</b>Volume confirms; it rarely leads on its own. Use it to judge how much to trust a move you already see on the price chart.</div>`

/* =====================================================================
   Chart School v2: built on "Make It Stick" and "Design for How People Learn"
   - One thing on screen at a time, ~10 minute sessions (ADHD-friendly)
   - Guess first, then learn (generation)  - Quiz, don't reread (retrieval)
   - Old cards come back on a schedule (spacing) - Mixed practice (interleaving)
   - Explain it in your own words, then rate yourself (elaboration, calibration)
   ===================================================================== */

{id:"l1",n:1,t:"Is it random?",min:8,steps:[
 S("hook",{text:"Can you tell a real market from a coin flip? Most people can't. Try it.",sub:"Two charts. One is a coin flip. Pick it."}),

 S("guess",{q:"\"Price discounts everything\" means…",o:["All known news and feelings are already in the price","Prices always fall in the end","Charts ignore the news"],a:0,e:"News, fear and hope all end up in the price. The chart is a summary of what everyone believes right now."}),

 S("guess",{q:"Why does a panic often mark the low?",o:["Once everyone has sold, few sellers are left","Exchanges stop trading","It doesn't, panics keep going forever"],a:0,e:"The urge you feel to sell at the bottom is shared by everyone. That wave of selling is what creates the bottom.",ex:"panic"}),
